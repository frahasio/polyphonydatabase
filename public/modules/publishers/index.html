<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publishers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Publishers</h1>
            <a href="/admin" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPublisherModal">
                        <i class="bi bi-plus-lg"></i> Add Publisher
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="publishersList">
                            <!-- Publishers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Publisher Modal -->
    <div class="modal fade" id="addPublisherModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Publisher</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPublisherForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePublisherButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display publishers
        async function fetchPublishers() {
            try {
                const response = await fetch('/api/admin/publishers');
                if (!response.ok) {
                    throw new Error('Failed to fetch publishers');
                }
                const data = await response.json();
                if (!data.publishers) {
                    throw new Error('Invalid response format');
                }
                displayPublishers(data.publishers);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load publishers. Please try again.');
            }
        }

        function displayPublishers(publishers) {
            const publishersList = document.getElementById('publishersList');
            
            publishersList.innerHTML = publishers.map(publisher => `
                <tr>
                    <td>${publisher.name || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editPublisher(${publisher.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePublisher(${publisher.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        const form = document.getElementById('addPublisherForm');
        const submitBtn = document.getElementById('savePublisherButton');
        const modal = document.getElementById('addPublisherModal');
        let editingId = null;

        submitBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const url = editingId ? `/api/admin/publishers/${editingId}` : '/api/admin/publishers';
                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    throw new Error(`Failed to ${editingId ? 'update' : 'create'} publisher`);
                }

                // Close modal and refresh list
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                form.reset();
                resetFormState();
                fetchPublishers();
            } catch (error) {
                console.error(`Error ${editingId ? 'updating' : 'creating'} publisher:`, error);
                alert(`Failed to ${editingId ? 'update' : 'create'} publisher. Please try again.`);
            }
        });

        function resetFormState() {
            editingId = null;
            modal.querySelector('.modal-title').textContent = 'Add New Publisher';
            submitBtn.textContent = 'Save';
        }

        // Handle edit
        async function editPublisher(id) {
            try {
                const response = await fetch(`/api/admin/publishers/${id}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch publisher details');
                }
                const data = await response.json();
                const publisher = data.publisher;

                // Set editing state
                editingId = id;
                modal.querySelector('.modal-title').textContent = 'Edit Publisher';
                submitBtn.textContent = 'Save Changes';

                // Populate the form with publisher data
                document.getElementById('name').value = publisher.name || '';

                // Show the modal
                const modalInstance = new bootstrap.Modal(modal);
                modalInstance.show();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load publisher details. Please try again.');
            }
        }

        // Reset form state when modal is hidden
        modal.addEventListener('hidden.bs.modal', resetFormState);

        // Delete publisher
        async function deletePublisher(id) {
            if (!confirm('Are you sure you want to delete this publisher?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/publishers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete publisher');
                }

                fetchPublishers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete publisher. Please try again.');
            }
        }

        // Initialize
        fetchPublishers();
    </script>
</body>
</html>
