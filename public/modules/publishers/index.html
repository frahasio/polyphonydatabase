<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publishers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Publishers</h1>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPublisherModal">
                        <i class="bi bi-plus-lg"></i> Add Publisher
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="publishersList">
                            <!-- Publishers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Publisher Modal -->
    <div class="modal fade" id="addPublisherModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Publisher</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPublisherForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePublisherButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display publishers
        async function fetchPublishers() {
            try {
                const response = await fetch('/publishers');
                const data = await response.json();
                const publishersList = document.getElementById('publishersList');
                publishersList.innerHTML = '';

                data.publishers.forEach(publisher => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${publisher.name || ''}</td>
                        <td>
                            <a href="edit.html?id=${publisher.id}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deletePublisher(${publisher.id})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    `;
                    publishersList.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load publishers');
            }
        }

        // Add new publisher
        document.getElementById('savePublisherButton').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const response = await fetch('/publishers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    throw new Error('Failed to create publisher');
                }

                // Close modal and refresh list
                const modal = bootstrap.Modal.getInstance(document.getElementById('addPublisherModal'));
                modal.hide();
                document.getElementById('addPublisherForm').reset();
                fetchPublishers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to create publisher');
            }
        });

        // Delete publisher
        async function deletePublisher(id) {
            if (!confirm('Are you sure you want to delete this publisher?')) {
                return;
            }

            try {
                const response = await fetch(`/publishers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete publisher');
                }

                fetchPublishers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete publisher');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchPublishers);
    </script>
</body>
</html>
