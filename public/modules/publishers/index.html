<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publishers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Publishers</h1>
            <div class="d-flex gap-2">
                <a href="/admin" class="btn btn-outline-secondary">
                    <i class="bi bi-house me-1"></i>Admin Dashboard
                </a>
                <a href="/" target="_blank" class="btn btn-outline-info">
                    <i class="bi bi-globe2 me-1"></i>Public Database
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="new.html" target="_blank" class="btn btn-primary" title="Add a new publisher (opens in new tab)">
                        <i class="bi bi-plus-lg"></i> Add Publisher
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="publishersList">
                            <!-- Publishers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display publishers
        async function fetchPublishers() {
            try {
                const response = await fetch('/api/admin/publishers');
                if (!response.ok) {
                    throw new Error('Failed to fetch publishers');
                }
                const data = await response.json();
                if (!data.publishers) {
                    throw new Error('Invalid response format');
                }
                displayPublishers(data.publishers);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load publishers. Please try again.');
            }
        }

        function displayPublishers(publishers) {
            const publishersList = document.getElementById('publishersList');
            
            publishersList.innerHTML = publishers.map(publisher => `
                <tr>
                    <td>${publisher.name || ''}</td>
                    <td>
                        <a href="edit.html?id=${publisher.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this publisher (opens in new tab)">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePublisher(${publisher.id})" title="Delete this publisher">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Delete publisher
        async function deletePublisher(id) {
            if (!confirm('Are you sure you want to delete this publisher?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/publishers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete publisher');
                }

                fetchPublishers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete publisher. Please try again.');
            }
        }

        // Initialize
        fetchPublishers();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
