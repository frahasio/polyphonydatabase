<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Editor - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edit Editor</h1>
            <a href="index.html" class="btn btn-outline-secondary">Back to List</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editorForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="dateOfBirth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth">
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-danger" id="deleteButton">Delete Editor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let editorId = null;

        // Get editor ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        editorId = urlParams.get('id');

        if (!editorId) {
            window.location.href = 'index.html';
        }

        // Fetch editor data
        async function fetchEditor() {
            try {
                const response = await fetch(`/editors/${editorId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch editor');
                }
                const editor = await response.json();
                
                // Populate form
                document.getElementById('name').value = editor.name || '';
                if (editor.dateOfBirth) {
                    const date = new Date(editor.dateOfBirth);
                    document.getElementById('dateOfBirth').value = date.toISOString().split('T')[0];
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load editor data. Please try again.');
            }
        }

        // Handle form submission
        document.getElementById('editorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                dateOfBirth: document.getElementById('dateOfBirth').value || null
            };

            try {
                const response = await fetch(`/editors/${editorId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update editor');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update editor. Please try again.');
            }
        });

        // Handle delete
        document.getElementById('deleteButton').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this editor?')) {
                return;
            }

            try {
                const response = await fetch(`/editors/${editorId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete editor');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete editor. Please try again.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchEditor);
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
