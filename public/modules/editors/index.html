<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editors - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .table-responsive {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editors</h1>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEditorModal">
                        <i class="bi bi-plus-lg"></i> Add Editor
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Date of Birth</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="editorsList">
                            <!-- Editors will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Editor Modal -->
    <div class="modal fade" id="addEditorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Editor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEditorForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditorButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }

        async function fetchEditors() {
            try {
                const response = await fetch('/api/editors');
                if (!response.ok) {
                    throw new Error('Failed to fetch editors');
                }
                const data = await response.json();
                if (!data.editors) {
                    throw new Error('Invalid response format');
                }
                displayEditors(data.editors);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load editors. Please try again.');
            }
        }

        function displayEditors(editors) {
            const editorsList = document.getElementById('editorsList');
            
            editorsList.innerHTML = editors.map(editor => `
                <tr>
                    <td>${editor.name || ''}</td>
                    <td>${formatDate(editor.dateOfBirth)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editEditor(${editor.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteEditor(${editor.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        const form = document.getElementById('addEditorForm');
        const submitBtn = document.getElementById('saveEditorButton');
        const modal = document.getElementById('addEditorModal');
        let editingId = null;

        submitBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const dateOfBirth = document.getElementById('dateOfBirth').value;

            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const url = editingId ? `/api/editors/${editingId}` : '/api/editors';
                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name,
                        date_of_birth: dateOfBirth || null
                    })
                });

                if (!response.ok) {
                    throw new Error(`Failed to ${editingId ? 'update' : 'create'} editor`);
                }

                // Close modal and refresh list
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                form.reset();
                resetFormState();
                fetchEditors();
            } catch (error) {
                console.error(`Error ${editingId ? 'updating' : 'creating'} editor:`, error);
                alert(`Failed to ${editingId ? 'update' : 'create'} editor. Please try again.`);
            }
        });

        function resetFormState() {
            editingId = null;
            modal.querySelector('.modal-title').textContent = 'Add New Editor';
            submitBtn.textContent = 'Save';
        }

        // Handle edit
        async function editEditor(id) {
            try {
                const response = await fetch(`/api/editors/${id}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch editor details');
                }
                const data = await response.json();
                const editor = data.editor;

                // Set editing state
                editingId = id;
                modal.querySelector('.modal-title').textContent = 'Edit Editor';
                submitBtn.textContent = 'Save Changes';

                // Populate the form with editor data
                document.getElementById('name').value = editor.name || '';
                document.getElementById('dateOfBirth').value = editor.date_of_birth || '';

                // Show the modal
                const modalInstance = new bootstrap.Modal(modal);
                modalInstance.show();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load editor details. Please try again.');
            }
        }

        // Reset form state when modal is hidden
        modal.addEventListener('hidden.bs.modal', resetFormState);

        // Delete editor
        async function deleteEditor(id) {
            if (!confirm('Are you sure you want to delete this editor?')) {
                return;
            }

            try {
                const response = await fetch(`/api/editors/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete editor');
                }

                fetchEditors();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete editor. Please try again.');
            }
        }

        // Initialize
        fetchEditors();
    </script>
</body>
</html>
