<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editors - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .table-responsive {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editors</h1>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="new.html" target="_blank" class="btn btn-primary" title="Add a new editor (opens in new tab)">
                        <i class="bi bi-plus-lg"></i> Add Editor
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Date of Birth</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="editorsList">
                            <!-- Editors will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchEditors() {
            try {
                const response = await fetch('/api/admin/editors');
                if (!response.ok) {
                    throw new Error('Failed to fetch editors');
                }
                const data = await response.json();
                if (!data.editors) {
                    throw new Error('Invalid response format');
                }
                displayEditors(data.editors);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load editors. Please try again.');
            }
        }

        function displayEditors(editors) {
            const editorsList = document.getElementById('editorsList');
            
            editorsList.innerHTML = editors.map(editor => `
                <tr>
                    <td>${editor.name || ''}</td>
                    <td>${editor.date_of_birth ? new Date(editor.date_of_birth).toLocaleDateString() : ''}</td>
                    <td>
                        <a href="edit.html?id=${editor.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this editor (opens in new tab)">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteEditor(${editor.id})" title="Delete this editor">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Delete editor
        async function deleteEditor(id) {
            if (!confirm('Are you sure you want to delete this editor?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/editors/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete editor');
                }

                fetchEditors();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete editor. Please try again.');
            }
        }

        // Initialize
        fetchEditors();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
