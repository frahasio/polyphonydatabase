<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editors - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .table-responsive {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Editors</h1>
            <a href="new.html" class="btn btn-primary">Create New Editor</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Date of Birth</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="editorsList">
                            <!-- Editors will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }

        async function fetchEditors() {
            try {
                const response = await fetch('/editors');
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to fetch editors');
                }
                const data = await response.json();
                if (!data.editors) {
                    throw new Error('Invalid response format');
                }
                displayEditors(data.editors);
            } catch (error) {
                console.error('Error:', error);
                const editorsList = document.getElementById('editorsList');
                editorsList.innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center text-danger">
                            Failed to load editors. Please try refreshing the page.
                        </td>
                    </tr>
                `;
            }
        }

        function displayEditors(editors) {
            const editorsList = document.getElementById('editorsList');
            
            editorsList.innerHTML = editors.map(editor => `
                <tr>
                    <td>${editor.name || ''}</td>
                    <td>${formatDate(editor.dateOfBirth)}</td>
                    <td>
                        <a href="edit.html?id=${editor.id}" class="btn btn-sm btn-outline-primary">Edit</a>
                    </td>
                </tr>
            `).join('');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchEditors);
    </script>
</body>
</html>
