            .booklet-toolbar, .booklet-navbar, .no-print, .booklet-spread-ui, .booklet-pane-list, .booklet-pane-editor { display: none !important; }
            #bookletPageStore:not(:empty) {
                position: static !important;
                left: auto !important;
                transform: none !important;
                z-index: auto !important;
                width: 100% !important;
                pointer-events: auto !important;
            }
            #bookletPageStore:not(:empty) .booklet-page {
                margin: 0 !important;
                box-shadow: none;
                overflow: hidden !important;
                page-break-after: always;
                break-after: page;
            }
            #bookletPageStore:not(:empty) .booklet-page[data-size="A4"] {
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
            }
            #bookletPageStore:not(:empty) .booklet-page[data-size="A5"] {
                height: 210mm !important;
                min-height: 210mm !important;
                max-height: 210mm !important;
            }
            #previewPages .booklet-page {
                box-shadow: none;
                margin: 0;
                overflow: hidden !important;
                page-break-after: always;
                break-after: page;
            }
            #previewPages .booklet-page[data-size="A4"] {
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
            }
            #previewPages .booklet-page[data-size="A5"] {
                height: 210mm !important;
                min-height: 210mm !important;
                max-height: 210mm !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar booklet-navbar py-2 no-print">
        <div class="container-fluid d-flex flex-wrap align-items-center gap-2">
            <a class="navbar-brand text-white mb-0" href="/"><i class="bi bi-arrow-left me-2"></i>Back to database</a>
            <span class="navbar-text text-white-50 small mb-0">Liturgy booklet creator <span class="badge bg-warning text-dark ms-1">BETA</span></span>
            <div class="ms-lg-auto">
                <span class="d-inline-block" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Coming soon — search and load shared booklets from other users.">
                    <button type="button" class="btn btn-sm btn-outline-light disabled" id="btnCommunityBooklets" style="pointer-events: none;">
                        <i class="bi bi-people me-1"></i>Community booklets
                    </button>
                </span>
            </div>
        </div>
    </nav>

    <div class="booklet-toolbar-group no-print">
    <div class="booklet-toolbar py-2 px-3">
        <div class="container-fluid">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <label class="small mb-0 d-flex align-items-center gap-1">
                    <span class="text-nowrap">Project title</span>
                    <input type="text" id="inpProjectTitle" class="form-control form-control-sm" style="min-width: 12rem; max-width: 22rem" placeholder="e.g. Easter Vigil 2026" title="Shown in filenames when you save">
                </label>
                <div class="vr d-none d-md-block"></div>
                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-primary" id="btnSaveProject" title="Download project JSON"><i class="bi bi-download me-1"></i>Save project</button>
                    <button type="button" class="btn btn-outline-primary" id="btnLoadProject"><i class="bi bi-upload me-1"></i>Load project</button>
                </div>
                <input type="file" id="fileLoadProject" accept=".json,application/json" class="d-none">
                <button type="button" class="btn btn-success btn-sm" id="btnDownloadPdf" title="Export as PDF via the server"><i class="bi bi-file-earmark-pdf me-1"></i>Download PDF</button>
                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-primary" id="btnRefreshLayout" title="Recalculate page layout"><i class="bi bi-arrow-clockwise me-1"></i>Refresh layout</button>
                    <label class="btn btn-outline-primary d-flex align-items-center gap-1 mb-0" title="Auto-refresh on changes">
                        <input class="form-check-input m-0" type="checkbox" id="chkAutoRefresh" checked>
                        <span class="small">Auto</span>
                    </label>
                </div>
                <div class="vr d-none d-md-block"></div>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#layoutSettingsPanel" title="Layout settings" id="btnLayoutToggle"><i class="bi bi-sliders me-1"></i>Layout</button>
                <div class="btn-group btn-group-sm" id="btnGroupPreviewDisplay">
                    <button type="button" class="btn btn-outline-secondary active" data-view="scroll" title="Scroll pages"><i class="bi bi-file-text me-1"></i>Pages</button>
                    <button type="button" class="btn btn-outline-secondary" data-view="booklet" title="Facing pages"><i class="bi bi-book me-1"></i>Spreads</button>
                </div>
                
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Useful tools</button>
                    <ul class="dropdown-menu dropdown-menu-end p-2 small" style="min-width: 300px;">
                        <li><h6 class="dropdown-header px-2 mb-1">Ben Bloomfield's suite of GABC tools</h6></li>
                        <li><a class="dropdown-item" href="https://bbloomf.github.io/jgabc/propers.html" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right me-2"></i>Mass propers (jgabc)</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="https://www.sourceandsummit.com/editor/alpha/" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right me-2"></i>Source &amp; Summit chant editor</a></li>
                        <li><a class="dropdown-item" href="https://github.com/frmatthew/exsurge" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right me-2"></i>Exsurge chant renderer (GitHub)</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="mailto:polyphonydatabase@gmail.com"><i class="bi bi-envelope me-2"></i>Report a bug / send feedback</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="collapse" id="layoutSettingsPanel">
        <div class="bg-light border-bottom px-3 py-2">
            <div class="container-fluid">
                <div class="d-flex flex-wrap align-items-end gap-3 small">
                    <label class="d-flex flex-column gap-0">
                        <span>Page size</span>
                        <select id="selPageSize" class="form-select form-select-sm" style="width:auto">
                            <option value="A4">A4</option>
                            <option value="A5">A5</option>
                        </select>
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Body font</span>
                        <select id="selBookletFont" class="form-select form-select-sm" style="width:auto">
                            <optgroup label="Serif">
                                <option value="Crimson Text" selected>Crimson Text</option>
                                <option value="EB Garamond">EB Garamond</option>
                                <option value="Cormorant Garamond">Cormorant Garamond</option>
                                <option value="Lora">Lora</option>
                                <option value="Libre Baskerville">Libre Baskerville</option>
                                <option value="Merriweather">Merriweather</option>
                                <option value="Spectral">Spectral</option>
                                <option value="Source Serif 4">Source Serif 4</option>
                                <option value="Noto Serif">Noto Serif</option>
                                <option value="Alegreya">Alegreya</option>
                                <option value="Cardo">Cardo</option>
                                <option value="Gentium Plus">Gentium Plus</option>
                                <option value="Playfair Display">Playfair Display</option>
                                <option value="Old Standard TT">Old Standard TT</option>
                                <option value="Gelasio">Gelasio</option>
                                <option value="Tinos">Tinos</option>
                            </optgroup>
                            <optgroup label="Sans-serif">
                                <option value="Open Sans">Open Sans</option>
                                <option value="Lato">Lato</option>
                                <option value="Inter">Inter</option>
                                <option value="Roboto">Roboto</option>
                                <option value="Noto Sans">Noto Sans</option>
                                <option value="Arimo">Arimo</option>
                                <option value="Fira Sans">Fira Sans</option>
                                <option value="Montserrat">Montserrat</option>
                            </optgroup>
                            <optgroup label="Monospace">
                                <option value="Courier Prime">Courier Prime</option>
                                <option value="Cousine">Cousine</option>
                                <option value="Source Code Pro">Source Code Pro</option>
                            </optgroup>
                        </select>
                    </label>
                    <label class="d-flex flex-column gap-0" title="Pixels to cover at the top of continuation pages to hide descender overshoot from the previous page's last line.">
                        <span>Desc. clip (px)</span>
                        <input type="number" id="inpDescClipPx" class="form-control form-control-sm" style="width:3.5rem" min="0" max="10" step="1" value="3">
                    </label>
                    <label class="d-flex flex-column gap-0" title="Pixels to cover at the bottom of pages to hide ascender overshoot from the next page's first line.">
                        <span>Asc. clip (px)</span>
                        <input type="number" id="inpAscClipPx" class="form-control form-control-sm" style="width:3.5rem" min="0" max="10" step="1" value="3">
                    </label>
                    <label class="d-flex flex-column gap-0" title="Vertical offset for drop cap letters (em units). Increase to push the drop cap down.">
                        <span>Drop cap offset</span>
                        <input type="number" id="inpDropCapOffset" class="form-control form-control-sm" style="width:4rem" min="-0.2" max="0.5" step="0.01" value="0.05">
                    </label>
                    <div class="vr"></div>
                    <label class="d-flex flex-column gap-0">
                        <span>Top margin (mm)</span>
                        <input type="number" id="inpMarginTop" class="form-control form-control-sm" style="width:4.5rem" min="4" max="50" step="1" value="16">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Bottom margin (mm)</span>
                        <input type="number" id="inpMarginBottom" class="form-control form-control-sm" style="width:4.5rem" min="4" max="50" step="1" value="16">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Left margin (mm)</span>
                        <input type="number" id="inpMarginLeft" class="form-control form-control-sm" style="width:4.5rem" min="4" max="50" step="1" value="16">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Right margin (mm)</span>
                        <input type="number" id="inpMarginRight" class="form-control form-control-sm" style="width:4.5rem" min="4" max="50" step="1" value="16">
                    </label>
                    <div class="vr"></div>
                    <label class="d-flex flex-column gap-0">
                        <span>Section gap (mm)</span>
                        <input type="number" id="inpSectionGap" class="form-control form-control-sm" style="width:4.5rem" min="0" max="40" step="1" value="8">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Gap tolerance (px)</span>
                        <input type="number" id="inpGapTolerance" class="form-control form-control-sm" style="width:4.5rem" min="0" max="20" step="1" value="4">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Margin tolerance (px)</span>
                        <input type="number" id="inpMarginTolerance" class="form-control form-control-sm" style="width:4.5rem" min="0" max="30" step="1" value="10">
                    </label>
                    <label class="d-flex flex-column gap-0">
                        <span>Min orphan lines</span>
                        <input type="number" id="inpOrphanLines" class="form-control form-control-sm" style="width:4.5rem" min="1" max="10" step="1" value="3">
                    </label>
                    <div class="vr"></div>
                    <div class="form-check d-flex align-items-end mb-0">
                        <input class="form-check-input" type="checkbox" id="chkDebugLayout">
                        <label class="form-check-label small ms-1" for="chkDebugLayout">Debug borders</label>
                    </div>
                    </div>
            </div>
        </div>
    </div>
    </div><!-- /.booklet-toolbar-group -->

    <div class="booklet-columns">
        <div class="booklet-pane booklet-pane-list no-print" id="bookletSidebar">
            <button type="button" class="booklet-pane-collapse-btn btn btn-sm btn-outline-secondary" id="btnCollapseList" title="Collapse list"><i class="bi bi-chevron-bar-left"></i></button>
            <div class="dropdown mb-2">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-plus-lg me-1"></i>Add section…
                    </button>
                    <ul class="dropdown-menu w-100">
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="rubric"><i class="bi bi-person-arms-up me-2"></i>Rubric</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="reading"><i class="bi bi-text-paragraph me-2"></i>Text</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="title"><i class="bi bi-text-center me-2"></i>Title rule</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="chant_gabc"><i class="bi bi-music-note-beamed me-2"></i>Chant (GABC)</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="image"><i class="bi bi-image me-2"></i>Image</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="edition_pdf"><i class="bi bi-file-earmark-pdf me-2"></i>Polyphony edition PDF</button></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="page_break"><i class="bi bi-file-earmark-break me-2"></i>Force page break</button></li>
                        <li><button type="button" class="dropdown-item sidebar-add-btn" data-add-type="spacer"><i class="bi bi-arrows-expand me-2"></i>Vertical spacer</button></li>
                </ul>
            </div>
            <div id="blockList"></div>
        </div>
        <div class="booklet-pane booklet-pane-editor no-print" id="bookletEditorPane">
            <button type="button" class="booklet-pane-collapse-btn btn btn-sm btn-outline-secondary" id="btnCloseEditor" title="Close editor"><i class="bi bi-x-lg"></i></button>
            <div id="editorPanel" class="small">
                <p class="text-muted small mb-0">Select a section or add one.</p>
            </div>
        </div>
        <main class="booklet-pane booklet-pane-preview booklet-main-preview">
            <div id="previewPages"></div>
        </main>
    </div>

    <div id="bookletPageStore" aria-hidden="true"></div>

    <div id="bookletMeasureMount" aria-hidden="true" style="position:absolute;left:-9999px;top:0;visibility:hidden;width:1px;height:1px;overflow:hidden;"></div>

    <input type="file" id="fileImagePick" accept="image/*" class="d-none">

    <script src="/vendor/jgabc/jquery.min.js"></script>
    <script src="/vendor/jgabc/exsurge.min.js"></script>
    <script src="/vendor/jgabc/util.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function(el){new bootstrap.Tooltip(el);});</script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="/modules/liturgy-booklet/booklet-app.js"></script>
</body>
</html>
