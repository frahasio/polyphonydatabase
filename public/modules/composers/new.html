<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Composer - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .composer-form {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="composer-form">
            <h2 class="mb-4">Create New Composer</h2>
            <form id="composerForm">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="fromYear">From Year</label>
                            <input type="number" class="form-control" id="fromYear" name="fromYear">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="toYear">To Year</label>
                            <input type="number" class="form-control" id="toYear" name="toYear">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fromYearAnnotation">From Year Annotation</label>
                            <input type="text" class="form-control" id="fromYearAnnotation" name="fromYearAnnotation">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="toYearAnnotation">To Year Annotation</label>
                            <input type="text" class="form-control" id="toYearAnnotation" name="toYearAnnotation">
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Birthplace</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="birthplace1" name="birthplace1" placeholder="City">
                            <input type="text" class="form-control" id="birthplace2" name="birthplace2" placeholder="Country">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Deathplace</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="deathplace1" name="deathplace1" placeholder="City">
                            <input type="text" class="form-control" id="deathplace2" name="deathplace2" placeholder="Country">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" class="form-control" id="imageUrl" name="imageUrl">
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Create Composer</button>
                    <a href="/modules/composers" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Handle form submission
        document.getElementById('composerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // API uses snake_case field names
            const formData = {
                name: document.getElementById('name').value,
                from_year: document.getElementById('fromYear').value,
                to_year: document.getElementById('toYear').value,
                from_year_annotation: document.getElementById('fromYearAnnotation').value,
                to_year_annotation: document.getElementById('toYearAnnotation').value,
                birthplace_1: document.getElementById('birthplace1').value,
                birthplace_2: document.getElementById('birthplace2').value,
                deathplace_1: document.getElementById('deathplace1').value,
                deathplace_2: document.getElementById('deathplace2').value,
                image_url: document.getElementById('imageUrl').value
            };

            try {
                const response = await fetch('/api/admin/composers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to create composer');
                }

                const composer = await response.json();
                alert('Composer created successfully');
                window.location.href = `/modules/composers/edit.html?id=${composer.id}`;
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to create composer');
            }
        });
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
