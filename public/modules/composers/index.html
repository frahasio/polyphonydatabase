<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .composer-card {
            height: 100%;
            transition: transform 0.2s;
        }
        .composer-card:hover {
            transform: translateY(-5px);
        }
        .composer-image {
            height: 200px;
            object-fit: cover;
        }
        .search-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-bottom: 1px solid #dee2e6;
        }
        .pagination-container {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-top: 1px solid #dee2e6;
        }
        .table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
        .table td {
            vertical-align: middle;
        }
        .year-range {
            white-space: nowrap;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Composers</h1>
            <a href="new.html" class="btn btn-primary">Create New Composer</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Years</th>
                                <th>Birthplace</th>
                                <th>Deathplace</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="composersList">
                            <!-- Composers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentSearch = '';
        let currentLetter = '';
        const limit = 12;

        function formatYearRange(composer) {
            const fromYear = composer.fromYear ? `${composer.fromYearAnnotation || ''}${composer.fromYear}` : '';
            const toYear = composer.toYear ? `${composer.toYearAnnotation || ''}${composer.toYear}` : '';
            
            if (fromYear && toYear) return `${fromYear}–${toYear}`;
            if (fromYear) return fromYear;
            if (toYear) return toYear;
            return '';
        }

        async function fetchComposers() {
            try {
                const response = await fetch('/composers');
                if (!response.ok) throw new Error('Failed to fetch composers');
                const data = await response.json();
                displayComposers(data.composers);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displayComposers(composers) {
            const composersList = document.getElementById('composersList');
            composersList.innerHTML = composers.map(composer => `
                <tr>
                    <td>${composer.name}</td>
                    <td class="year-range">${formatYearRange(composer)}</td>
                    <td>${[composer.birthplace1, composer.birthplace2].filter(Boolean).join(', ') || ''}</td>
                    <td>${[composer.deathplace1, composer.deathplace2].filter(Boolean).join(', ') || ''}</td>
                    <td>
                        <a href="edit.html?id=${composer.id}" class="btn btn-sm btn-outline-primary">Edit</a>
                    </td>
                </tr>
            `).join('');
        }

        // Load composers when the page loads
        document.addEventListener('DOMContentLoaded', fetchComposers);
    </script>
</body>
</html>
