<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .composer-card {
            height: 100%;
            transition: transform 0.2s;
        }
        .composer-card:hover {
            transform: translateY(-5px);
        }
        .composer-image {
            height: 200px;
            object-fit: cover;
        }
        .search-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-bottom: 1px solid #dee2e6;
        }
        .pagination-container {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-top: 1px solid #dee2e6;
        }
        .table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
        .table td {
            vertical-align: middle;
        }
        .year-range {
            white-space: nowrap;
            color: #666;
        }
        .letter-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 1rem;
        }
        .letter-filter .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .letter-filter .btn.active {
            background-color: #0d6efd;
            color: white;
        }
        .letter-filter .btn.partial {
            background-color: #e9ecef;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .first-of-letter {
            background-color: #f8f9fa;
            border-top: 2px solid #0d6efd;
        }
        .first-of-letter td {
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Composers</h1>
            <a href="/admin" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addComposerModal">
                        <i class="bi bi-plus-lg"></i> Add Composer
                    </button>
                </div>

                <div class="mb-3">
                    <div class="letter-filter">
                        <button class="btn btn-outline-secondary" data-letter="A">A</button>
                        <button class="btn btn-outline-secondary" data-letter="B">B</button>
                        <button class="btn btn-outline-secondary" data-letter="C">C</button>
                        <button class="btn btn-outline-secondary" data-letter="D">D</button>
                        <button class="btn btn-outline-secondary" data-letter="E">E</button>
                        <button class="btn btn-outline-secondary" data-letter="F">F</button>
                        <button class="btn btn-outline-secondary" data-letter="G">G</button>
                        <button class="btn btn-outline-secondary" data-letter="H">H</button>
                        <button class="btn btn-outline-secondary" data-letter="I">I</button>
                        <button class="btn btn-outline-secondary" data-letter="J">J</button>
                        <button class="btn btn-outline-secondary" data-letter="K">K</button>
                        <button class="btn btn-outline-secondary" data-letter="L">L</button>
                        <button class="btn btn-outline-secondary" data-letter="M">M</button>
                        <button class="btn btn-outline-secondary" data-letter="N">N</button>
                        <button class="btn btn-outline-secondary" data-letter="O">O</button>
                        <button class="btn btn-outline-secondary" data-letter="P">P</button>
                        <button class="btn btn-outline-secondary" data-letter="Q">Q</button>
                        <button class="btn btn-outline-secondary" data-letter="R">R</button>
                        <button class="btn btn-outline-secondary" data-letter="S">S</button>
                        <button class="btn btn-outline-secondary" data-letter="T">T</button>
                        <button class="btn btn-outline-secondary" data-letter="U">U</button>
                        <button class="btn btn-outline-secondary" data-letter="V">V</button>
                        <button class="btn btn-outline-secondary" data-letter="W">W</button>
                        <button class="btn btn-outline-secondary" data-letter="X">X</button>
                        <button class="btn btn-outline-secondary" data-letter="Y">Y</button>
                        <button class="btn btn-outline-secondary" data-letter="Z">Z</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Years</th>
                                <th>Birthplace</th>
                                <th>Deathplace</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="composersList">
                            <!-- Composers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Composer Modal -->
    <div class="modal fade" id="addComposerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Composer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addComposerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">From Year</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="fromYearAnnotation" name="fromYearAnnotation" placeholder="c." style="max-width: 60px;">
                                    <input type="number" class="form-control" id="fromYear" name="fromYear" placeholder="Year">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">To Year</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="toYearAnnotation" name="toYearAnnotation" placeholder="c." style="max-width: 60px;">
                                    <input type="number" class="form-control" id="toYear" name="toYear" placeholder="Year">
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="birthplace1" class="form-label">Birth town</label>
                                <input type="text" class="form-control" id="birthplace1" name="birthplace1">
                            </div>
                            <div class="col-md-6">
                                <label for="birthplace2" class="form-label">Birth country</label>
                                <input type="text" class="form-control" id="birthplace2" name="birthplace2">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="deathplace1" class="form-label">Death town</label>
                                <input type="text" class="form-control" id="deathplace1" name="deathplace1">
                            </div>
                            <div class="col-md-6">
                                <label for="deathplace2" class="form-label">Death country</label>
                                <input type="text" class="form-control" id="deathplace2" name="deathplace2">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="addComposerBtn">Add Composer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentLetter = 'A';  // Default to A

        // Function to update URL with current state
        function updateURL() {
            const params = new URLSearchParams();
            if (currentLetter !== 'A') params.set('letter', currentLetter);
            const newURL = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
            window.history.pushState({}, '', newURL);
        }

        // Function to get initial state from URL
        function getInitialState() {
            const params = new URLSearchParams(window.location.search);
            const letter = params.get('letter');
            if (letter) {
                currentLetter = letter.toUpperCase();
            }
            // Set the active state for the current letter button
            const letterButton = document.querySelector(`.letter-filter .btn[data-letter="${currentLetter}"]`);
            if (letterButton) {
                letterButton.classList.add('active');
            }
        }

        function formatYearRange(composer) {
            const fromYear = composer.fromYear ? `${composer.fromYearAnnotation || ''}${composer.fromYear}` : '';
            const toYear = composer.toYear ? `${composer.toYearAnnotation || ''}${composer.toYear}` : '';
            
            if (fromYear && toYear) return `${fromYear}–${toYear}`;
            if (fromYear) return fromYear;
            if (toYear) return toYear;
            return '';
        }

        async function fetchComposers() {
            try {
                const response = await fetch(`/api/admin/composers`);
                if (!response.ok) {
                    throw new Error('Failed to fetch composers');
                }
                const data = await response.json();
                if (!data.composers) {
                    throw new Error('Invalid response format');
                }
                // Filter composers by first letter
                const filteredComposers = data.composers.filter(composer => 
                    composer.name.toUpperCase().startsWith(currentLetter)
                );
                displayComposers(filteredComposers);
                updateURL();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load composers. Please try again.');
            }
        }

        function displayComposers(composers) {
            const tbody = document.getElementById('composersList');
            let currentFirstLetter = '';
            let html = '';

            composers.forEach(composer => {
                const firstLetter = composer.name.charAt(0).toUpperCase();
                const isFirstOfLetter = firstLetter !== currentFirstLetter;
                if (isFirstOfLetter) {
                    currentFirstLetter = firstLetter;
                }

                html += `
                    <tr class="${isFirstOfLetter ? 'first-of-letter' : ''}">
                        <td>${composer.name}</td>
                        <td class="year-range">${formatYearRange(composer)}</td>
                        <td>${composer.birthplace1 || ''}${composer.birthplace2 ? `, ${composer.birthplace2}` : ''}</td>
                        <td>${composer.deathplace1 || ''}${composer.deathplace2 ? `, ${composer.deathplace2}` : ''}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="editComposer(${composer.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteComposer(${composer.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Handle form submission
        const form = document.getElementById('addComposerForm');
        const submitBtn = document.getElementById('addComposerBtn');
        const modal = document.getElementById('addComposerModal');
        let editingId = null;

        submitBtn.addEventListener('click', async () => {
            const formData = new FormData(form);
            
            // Convert form data to object
            const data = {
                name: formData.get('name'),
                from_year: formData.get('fromYear'),
                to_year: formData.get('toYear'),
                from_year_annotation: formData.get('fromYearAnnotation'),
                to_year_annotation: formData.get('toYearAnnotation'),
                birthplace_1: formData.get('birthplace1'),
                birthplace_2: formData.get('birthplace2'),
                deathplace_1: formData.get('deathplace1'),
                deathplace_2: formData.get('deathplace2')
            };

            try {
                const url = editingId ? `/api/admin/composers/${editingId}` : '/api/admin/composers';
                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Failed to ${editingId ? 'update' : 'create'} composer`);
                }

                // Close modal and refresh list
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                form.reset();
                resetFormState();
                fetchComposers();
            } catch (error) {
                console.error(`Error ${editingId ? 'updating' : 'creating'} composer:`, error);
                alert(`Failed to ${editingId ? 'update' : 'create'} composer. Please try again.`);
            }
        });

        function resetFormState() {
            editingId = null;
            modal.querySelector('.modal-title').textContent = 'Add New Composer';
            submitBtn.textContent = 'Add Composer';
        }

        // Handle delete
        async function deleteComposer(id) {
            if (!confirm('Are you sure you want to delete this composer?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/composers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete composer');
                }

                fetchComposers();
            } catch (error) {
                console.error('Error deleting composer:', error);
                alert('Failed to delete composer. Please try again.');
            }
        }

        // Handle letter filter clicks
        document.querySelectorAll('.letter-filter .btn').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                document.querySelectorAll('.letter-filter .btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                // Add active class to clicked button
                button.classList.add('active');
                // Update current letter and fetch composers
                currentLetter = button.dataset.letter;
                fetchComposers();
            });
        });

        // Handle edit
        async function editComposer(id) {
            try {
                const response = await fetch(`/api/admin/composers/${id}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch composer details');
                }
                const data = await response.json();
                const composer = data.composer;

                // Set editing state
                editingId = id;
                modal.querySelector('.modal-title').textContent = 'Edit Composer';
                submitBtn.textContent = 'Save Changes';

                // Populate the form with composer data
                form.name.value = composer.name;
                form.fromYear.value = composer.from_year || '';
                form.toYear.value = composer.to_year || '';
                form.fromYearAnnotation.value = composer.from_year_annotation || '';
                form.toYearAnnotation.value = composer.to_year_annotation || '';
                form.birthplace1.value = composer.birthplace_1 || '';
                form.birthplace2.value = composer.birthplace_2 || '';
                form.deathplace1.value = composer.deathplace_1 || '';
                form.deathplace2.value = composer.deathplace_2 || '';

                // Show the modal
                const modalInstance = new bootstrap.Modal(modal);
                modalInstance.show();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load composer details. Please try again.');
            }
        }

        // Reset form state when modal is hidden
        modal.addEventListener('hidden.bs.modal', resetFormState);

        // Initialize
        getInitialState();
        fetchComposers();
    </script>
</body>
</html>
