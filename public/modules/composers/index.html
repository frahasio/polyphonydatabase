<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .composer-card {
            height: 100%;
            transition: transform 0.2s;
        }
        .composer-card:hover {
            transform: translateY(-5px);
        }
        .composer-image {
            height: 200px;
            object-fit: cover;
        }
        .search-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-bottom: 1px solid #dee2e6;
        }
        .pagination-container {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-top: 1px solid #dee2e6;
        }
        .table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
        .table td {
            vertical-align: middle;
        }
        .year-range {
            white-space: nowrap;
            color: #666;
        }
        .letter-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 1rem;
        }
        .letter-filter .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .letter-filter .btn.active {
            background-color: #0d6efd;
            color: white;
        }
        .letter-filter .btn.partial {
            background-color: #e9ecef;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .first-of-letter {
            background-color: #f8f9fa;
            border-top: 2px solid #0d6efd;
        }
        .first-of-letter td {
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Composers</h1>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addComposerModal">
                        <i class="bi bi-plus-lg"></i> Add Composer
                    </button>
                </div>

                <div class="mb-3">
                    <div class="letter-filter">
                        <button class="btn btn-outline-secondary" data-letter="A">A</button>
                        <button class="btn btn-outline-secondary" data-letter="B">B</button>
                        <button class="btn btn-outline-secondary" data-letter="C">C</button>
                        <button class="btn btn-outline-secondary" data-letter="D">D</button>
                        <button class="btn btn-outline-secondary" data-letter="E">E</button>
                        <button class="btn btn-outline-secondary" data-letter="F">F</button>
                        <button class="btn btn-outline-secondary" data-letter="G">G</button>
                        <button class="btn btn-outline-secondary" data-letter="H">H</button>
                        <button class="btn btn-outline-secondary" data-letter="I">I</button>
                        <button class="btn btn-outline-secondary" data-letter="J">J</button>
                        <button class="btn btn-outline-secondary" data-letter="K">K</button>
                        <button class="btn btn-outline-secondary" data-letter="L">L</button>
                        <button class="btn btn-outline-secondary" data-letter="M">M</button>
                        <button class="btn btn-outline-secondary" data-letter="N">N</button>
                        <button class="btn btn-outline-secondary" data-letter="O">O</button>
                        <button class="btn btn-outline-secondary" data-letter="P">P</button>
                        <button class="btn btn-outline-secondary" data-letter="Q">Q</button>
                        <button class="btn btn-outline-secondary" data-letter="R">R</button>
                        <button class="btn btn-outline-secondary" data-letter="S">S</button>
                        <button class="btn btn-outline-secondary" data-letter="T">T</button>
                        <button class="btn btn-outline-secondary" data-letter="U">U</button>
                        <button class="btn btn-outline-secondary" data-letter="V">V</button>
                        <button class="btn btn-outline-secondary" data-letter="W">W</button>
                        <button class="btn btn-outline-secondary" data-letter="X">X</button>
                        <button class="btn btn-outline-secondary" data-letter="Y">Y</button>
                        <button class="btn btn-outline-secondary" data-letter="Z">Z</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Years</th>
                                <th>Birthplace</th>
                                <th>Deathplace</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="composersList">
                            <!-- Composers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Composer Modal -->
    <div class="modal fade" id="addComposerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Composer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addComposerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="fromYear" class="form-label">From Year</label>
                            <input type="number" class="form-control" id="fromYear" name="fromYear">
                        </div>
                        <div class="mb-3">
                            <label for="toYear" class="form-label">To Year</label>
                            <input type="number" class="form-control" id="toYear" name="toYear">
                        </div>
                        <div class="mb-3">
                            <label for="birthplace1" class="form-label">Birthplace</label>
                            <input type="text" class="form-control" id="birthplace1" name="birthplace1">
                        </div>
                        <div class="mb-3">
                            <label for="deathplace1" class="form-label">Deathplace</label>
                            <input type="text" class="form-control" id="deathplace1" name="deathplace1">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveComposerButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentLetter = 'A';  // Default to A

        // Function to update URL with current state
        function updateURL() {
            const params = new URLSearchParams();
            if (currentLetter !== 'A') params.set('letter', currentLetter);
            const newURL = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
            window.history.pushState({}, '', newURL);
        }

        // Function to get initial state from URL
        function getInitialState() {
            const params = new URLSearchParams(window.location.search);
            const letter = params.get('letter');
            if (letter) {
                currentLetter = letter.toUpperCase();
            }
            // Set the active state for the current letter button
            const letterButton = document.querySelector(`.letter-filter .btn[data-letter="${currentLetter}"]`);
            if (letterButton) {
                letterButton.classList.add('active');
            }
        }

        function formatYearRange(composer) {
            const fromYear = composer.fromYear ? `${composer.fromYearAnnotation || ''}${composer.fromYear}` : '';
            const toYear = composer.toYear ? `${composer.toYearAnnotation || ''}${composer.toYear}` : '';
            
            if (fromYear && toYear) return `${fromYear}–${toYear}`;
            if (fromYear) return fromYear;
            if (toYear) return toYear;
            return '';
        }

        async function fetchComposers() {
            try {
                const response = await fetch(`/composers?letter=${currentLetter}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch composers');
                }
                const data = await response.json();
                if (!data.composers) {
                    throw new Error('Invalid response format');
                }
                displayComposers(data.composers);
                updateURL();
            } catch (error) {
                console.error('Error:', error);
                const composersList = document.getElementById('composersList');
                composersList.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-danger">
                            Failed to load composers. Please try refreshing the page.
                        </td>
                    </tr>
                `;
            }
        }

        function displayComposers(composers) {
            const composersList = document.getElementById('composersList');
            let currentFirstLetter = '';
            
            composersList.innerHTML = composers.map(composer => {
                const firstLetter = composer.name.charAt(0).toUpperCase();
                const isFirstOfLetter = firstLetter !== currentFirstLetter;
                if (isFirstOfLetter) {
                    currentFirstLetter = firstLetter;
                }
                
                return `
                    <tr class="${isFirstOfLetter ? 'first-of-letter' : ''}">
                        <td>${composer.name}</td>
                        <td class="year-range">${formatYearRange(composer)}</td>
                        <td>${[composer.birthplace1, composer.birthplace2].filter(Boolean).join(', ') || ''}</td>
                        <td>${[composer.deathplace1, composer.deathplace2].filter(Boolean).join(', ') || ''}</td>
                        <td>
                            <a href="edit.html?id=${composer.id}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteComposer(${composer.id})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Add new composer
        document.getElementById('saveComposerButton').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const fromYear = document.getElementById('fromYear').value;
            const toYear = document.getElementById('toYear').value;
            const birthplace1 = document.getElementById('birthplace1').value;
            const deathplace1 = document.getElementById('deathplace1').value;

            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const response = await fetch('/composers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        fromYear: fromYear || null,
                        toYear: toYear || null,
                        birthplace1: birthplace1 || null,
                        deathplace1: deathplace1 || null
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to create composer');
                }

                // Close modal and refresh list
                const modal = bootstrap.Modal.getInstance(document.getElementById('addComposerModal'));
                modal.hide();
                document.getElementById('addComposerForm').reset();
                fetchComposers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to create composer. Please try again.');
            }
        });

        // Delete composer
        async function deleteComposer(id) {
            if (!confirm('Are you sure you want to delete this composer?')) {
                return;
            }

            try {
                const response = await fetch(`/composers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete composer');
                }

                fetchComposers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete composer. Please try again.');
            }
        }

        // Event Listeners
        document.querySelectorAll('.letter-filter .btn').forEach(button => {
            button.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.letter-filter .btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                button.classList.add('active');
                
                // Update current letter and fetch composers
                currentLetter = button.dataset.letter;
                fetchComposers();
            });
        });

        // Initialize from URL parameters
        document.addEventListener('DOMContentLoaded', () => {
            getInitialState();
            fetchComposers();
        });
    </script>
</body>
</html>
