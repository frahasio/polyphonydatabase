<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .composer-card {
            height: 100%;
            transition: transform 0.2s;
        }
        .composer-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .composer-image {
            height: 200px;
            object-fit: cover;
        }
        .search-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-bottom: 1px solid #dee2e6;
        }
        .pagination-container {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            background: white;
            padding: 1rem 0;
            border-top: 1px solid #dee2e6;
        }
        .table th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 1;
        }
        .table td {
            vertical-align: middle;
        }
        .year-range {
            white-space: nowrap;
            color: #666;
        }
        .letter-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-bottom: 1rem;
        }
        .letter-filter .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        .letter-filter .btn.active {
            background-color: #0d6efd;
            color: white;
        }
        .letter-filter .btn.partial {
            background-color: #e9ecef;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .first-of-letter {
            background-color: #f8f9fa;
            border-top: 2px solid #0d6efd;
        }
        .first-of-letter td {
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Composers</h1>
            <div class="d-flex gap-2">
                <a href="/admin" class="btn btn-outline-secondary">
                    <i class="bi bi-house me-1"></i>Admin Dashboard
                </a>
                <a href="/" target="_blank" class="btn btn-outline-info">
                    <i class="bi bi-globe2 me-1"></i>Public Database
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="new.html" target="_blank" class="btn btn-primary" title="Add a new composer (opens in new tab)">
                        <i class="bi bi-plus-lg"></i> Add Composer
                    </a>
                </div>

                <div class="mb-3">
                    <div class="letter-filter">
                        <button class="btn btn-outline-secondary" data-letter="A">A</button>
                        <button class="btn btn-outline-secondary" data-letter="B">B</button>
                        <button class="btn btn-outline-secondary" data-letter="C">C</button>
                        <button class="btn btn-outline-secondary" data-letter="D">D</button>
                        <button class="btn btn-outline-secondary" data-letter="E">E</button>
                        <button class="btn btn-outline-secondary" data-letter="F">F</button>
                        <button class="btn btn-outline-secondary" data-letter="G">G</button>
                        <button class="btn btn-outline-secondary" data-letter="H">H</button>
                        <button class="btn btn-outline-secondary" data-letter="I">I</button>
                        <button class="btn btn-outline-secondary" data-letter="J">J</button>
                        <button class="btn btn-outline-secondary" data-letter="K">K</button>
                        <button class="btn btn-outline-secondary" data-letter="L">L</button>
                        <button class="btn btn-outline-secondary" data-letter="M">M</button>
                        <button class="btn btn-outline-secondary" data-letter="N">N</button>
                        <button class="btn btn-outline-secondary" data-letter="O">O</button>
                        <button class="btn btn-outline-secondary" data-letter="P">P</button>
                        <button class="btn btn-outline-secondary" data-letter="Q">Q</button>
                        <button class="btn btn-outline-secondary" data-letter="R">R</button>
                        <button class="btn btn-outline-secondary" data-letter="S">S</button>
                        <button class="btn btn-outline-secondary" data-letter="T">T</button>
                        <button class="btn btn-outline-secondary" data-letter="U">U</button>
                        <button class="btn btn-outline-secondary" data-letter="V">V</button>
                        <button class="btn btn-outline-secondary" data-letter="W">W</button>
                        <button class="btn btn-outline-secondary" data-letter="X">X</button>
                        <button class="btn btn-outline-secondary" data-letter="Y">Y</button>
                        <button class="btn btn-outline-secondary" data-letter="Z">Z</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Years</th>
                                <th>Birthplace</th>
                                <th>Deathplace</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="composersList">
                            <!-- Composers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentLetter = 'A';  // Default to A

        // Function to update URL with current state
        function updateURL() {
            const params = new URLSearchParams();
            if (currentLetter !== 'A') params.set('letter', currentLetter);
            const newURL = `${window.location.pathname}${params.toString() ? '?' + params.toString() : ''}`;
            window.history.pushState({}, '', newURL);
        }

        // Function to get initial state from URL
        function getInitialState() {
            const params = new URLSearchParams(window.location.search);
            const letter = params.get('letter');
            if (letter) {
                currentLetter = letter.toUpperCase();
            }
            // Set the active state for the current letter button
            const letterButton = document.querySelector(`.letter-filter .btn[data-letter="${currentLetter}"]`);
            if (letterButton) {
                letterButton.classList.add('active');
            }
        }

        function formatYearRange(composer) {
            const fromYear = composer.fromYear ? `${composer.fromYearAnnotation || ''}${composer.fromYear}` : '';
            const toYear = composer.toYear ? `${composer.toYearAnnotation || ''}${composer.toYear}` : '';
            
            if (fromYear && toYear) return `${fromYear}–${toYear}`;
            if (fromYear) return fromYear;
            if (toYear) return toYear;
            return '';
        }

        async function fetchComposers() {
            try {
                const response = await fetch(`/api/admin/composers`);
                if (!response.ok) {
                    throw new Error('Failed to fetch composers');
                }
                const data = await response.json();
                if (!data.composers) {
                    throw new Error('Invalid response format');
                }
                // Filter composers by first letter
                const filteredComposers = data.composers.filter(composer => 
                    composer.name.toUpperCase().startsWith(currentLetter)
                );
                displayComposers(filteredComposers);
                updateURL();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load composers. Please try again.');
            }
        }

        function displayComposers(composers) {
            const tbody = document.getElementById('composersList');
            let currentFirstLetter = '';
            let html = '';

            composers.forEach(composer => {
                const firstLetter = composer.name.charAt(0).toUpperCase();
                const isFirstOfLetter = firstLetter !== currentFirstLetter;
                if (isFirstOfLetter) {
                    currentFirstLetter = firstLetter;
                }

                html += `
                    <tr class="${isFirstOfLetter ? 'first-of-letter' : ''}">
                        <td>${composer.name}</td>
                        <td class="year-range">${formatYearRange(composer)}</td>
                        <td>${composer.birthplace1 || ''}${composer.birthplace2 ? `, ${composer.birthplace2}` : ''}</td>
                        <td>${composer.deathplace1 || ''}${composer.deathplace2 ? `, ${composer.deathplace2}` : ''}</td>
                        <td>
                            <a href="edit.html?id=${composer.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this composer (opens in new tab)">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteComposer(${composer.id})" title="Delete this composer">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // Handle delete
        async function deleteComposer(id) {
            if (!confirm('Are you sure you want to delete this composer?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/composers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete composer');
                }

                fetchComposers();
            } catch (error) {
                console.error('Error deleting composer:', error);
                alert('Failed to delete composer. Please try again.');
            }
        }

        // Handle letter filter clicks
        document.querySelectorAll('.letter-filter .btn').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                document.querySelectorAll('.letter-filter .btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                // Add active class to clicked button
                button.classList.add('active');
                // Update current letter and fetch composers
                currentLetter = button.dataset.letter;
                fetchComposers();
            });
        });

        // Initialize
        getInitialState();
        fetchComposers();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
