<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Composer - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edit Composer</h1>
            <a href="index.html" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editComposerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">From Year</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="fromYearAnnotation" name="fromYearAnnotation" placeholder="Annotation">
                                <input type="number" class="form-control" id="fromYear" name="fromYear" placeholder="Year">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">To Year</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="toYearAnnotation" name="toYearAnnotation" placeholder="Annotation">
                                <input type="number" class="form-control" id="toYear" name="toYear" placeholder="Year">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="birthplace1" class="form-label">Birthplace 1</label>
                        <input type="text" class="form-control" id="birthplace1" name="birthplace1">
                    </div>
                    <div class="mb-3">
                        <label for="birthplace2" class="form-label">Birthplace 2</label>
                        <input type="text" class="form-control" id="birthplace2" name="birthplace2">
                    </div>
                    <div class="mb-3">
                        <label for="deathplace1" class="form-label">Deathplace 1</label>
                        <input type="text" class="form-control" id="deathplace1" name="deathplace1">
                    </div>
                    <div class="mb-3">
                        <label for="deathplace2" class="form-label">Deathplace 2</label>
                        <input type="text" class="form-control" id="deathplace2" name="deathplace2">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                        <button type="button" class="btn btn-danger" onclick="deleteComposer()">
                            <i class="bi bi-trash"></i> Delete Composer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const composerId = new URLSearchParams(window.location.search).get('id');
        if (!composerId) {
            window.location.href = 'index.html';
        }

        // Fetch composer data
        async function fetchComposer() {
            try {
                const response = await fetch(`/composers/${composerId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch composer');
                }
                const composer = await response.json();
                
                // Populate form
                document.getElementById('name').value = composer.name || '';
                document.getElementById('fromYear').value = composer.fromYear || '';
                document.getElementById('toYear').value = composer.toYear || '';
                document.getElementById('fromYearAnnotation').value = composer.fromYearAnnotation || '';
                document.getElementById('toYearAnnotation').value = composer.toYearAnnotation || '';
                document.getElementById('birthplace1').value = composer.birthplace1 || '';
                document.getElementById('deathplace1').value = composer.deathplace1 || '';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load composer data. Please try again.');
                window.location.href = 'index.html';
            }
        }

        // Handle form submission
        document.getElementById('editComposerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const fromYear = document.getElementById('fromYear').value;
            const toYear = document.getElementById('toYear').value;
            const fromYearAnnotation = document.getElementById('fromYearAnnotation').value;
            const toYearAnnotation = document.getElementById('toYearAnnotation').value;
            const birthplace1 = document.getElementById('birthplace1').value;
            const deathplace1 = document.getElementById('deathplace1').value;

            try {
                const response = await fetch(`/composers/${composerId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        fromYear: fromYear || null,
                        toYear: toYear || null,
                        fromYearAnnotation: fromYearAnnotation || null,
                        toYearAnnotation: toYearAnnotation || null,
                        birthplace1: birthplace1 || null,
                        deathplace1: deathplace1 || null
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update composer');
                }

                alert('Composer updated successfully');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update composer. Please try again.');
            }
        });

        // Handle deletion
        async function deleteComposer() {
            if (!confirm('Are you sure you want to delete this composer?')) {
                return;
            }

            try {
                const response = await fetch(`/composers/${composerId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete composer');
                }

                alert('Composer deleted successfully');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete composer. Please try again.');
            }
        }

        // Load composer data when page loads
        document.addEventListener('DOMContentLoaded', fetchComposer);
    </script>
</body>
</html>
