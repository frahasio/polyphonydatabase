<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Composer - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .composer-form {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edit Composer</h1>
            <a href="index.html" class="btn btn-outline-secondary">Back to List</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="composerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="displayYears" class="form-label">Years</label>
                        <input type="text" class="form-control" id="displayYears" name="displayYears" 
                               placeholder="e.g., c.1500–1550 or fl.1520">
                        <div class="form-text">Enter years in format: [prefix]year–[prefix]year (e.g., c.1500–1550 or fl.1520)</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="birthplace1" class="form-label">Birthplace (City)</label>
                                <input type="text" class="form-control" id="birthplace1" name="birthplace1">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="birthplace2" class="form-label">Birthplace (Country/Region)</label>
                                <input type="text" class="form-control" id="birthplace2" name="birthplace2">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="deathplace1" class="form-label">Deathplace (City)</label>
                                <input type="text" class="form-control" id="deathplace1" name="deathplace1">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="deathplace2" class="form-label">Deathplace (Country/Region)</label>
                                <input type="text" class="form-control" id="deathplace2" name="deathplace2">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-danger" id="deleteButton">Delete Composer</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const composerId = new URLSearchParams(window.location.search).get('id');
        if (!composerId) {
            window.location.href = 'index.html';
        }

        async function fetchComposer() {
            try {
                const response = await fetch(`/composers/${composerId}`);
                if (!response.ok) throw new Error('Failed to fetch composer');
                const composer = await response.json();
                populateForm(composer);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function populateForm(composer) {
            document.getElementById('name').value = composer.name || '';
            document.getElementById('displayYears').value = composer.displayYears || '';
            document.getElementById('birthplace1').value = composer.birthplace1 || '';
            document.getElementById('birthplace2').value = composer.birthplace2 || '';
            document.getElementById('deathplace1').value = composer.deathplace1 || '';
            document.getElementById('deathplace2').value = composer.deathplace2 || '';
        }

        document.getElementById('composerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`/composers/${composerId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Failed to update composer');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update composer. Please try again.');
            }
        });

        document.getElementById('deleteButton').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this composer?')) return;

            try {
                const response = await fetch(`/composers/${composerId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete composer');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete composer. Please try again.');
            }
        });

        // Load composer data when the page loads
        document.addEventListener('DOMContentLoaded', fetchComposer);
    </script>
</body>
</html>
