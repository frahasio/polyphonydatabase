<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Source - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Edit Source</h1>
                <p class="text-muted">Update source details and inclusions</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Sources
                </a>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="text-center py-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading source data...</p>
        </div>

        <!-- Main content -->
        <div id="mainContent" style="display: none;">
            <!-- Source Details -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Source Details</h5>
                </div>
                <div class="card-body">
                    <form id="editSourceForm">
                        <input type="hidden" id="source_id">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="code" class="form-label">Code *</label>
                                    <input type="text" class="form-control" id="code" name="code" required>
                                </div>
                                <div class="mb-3">
                                    <label for="title" class="form-label">Title</label>
                                    <input type="text" class="form-control" id="title" name="title">
                                </div>
                                <div class="mb-3">
                                    <label for="type" class="form-label">Type</label>
                                    <select class="form-control" id="type" name="type">
                                        <option value="">Select Type</option>
                                        <option value="MS">MS</option>
                                        <option value="Print">Print</option>
                                        <option value="Print/MS">Print/MS</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="format" class="form-label">Format</label>
                                    <select class="form-control" id="format" name="format">
                                        <option value="">Select Format</option>
                                        <option value="Choirbook">Choirbook</option>
                                        <option value="Partbook">Partbook</option>
                                        <option value="Score">Score</option>
                                        <option value="Tablature">Tablature</option>
                                        <option value="Tablebook">Tablebook</option>
                                        <option value="Multiple_choirbooks">Multiple choirbooks</option>
                                        <option value="Choirbook/score">Choirbook/score</option>
                                        <option value="Partbook/score">Partbook/score</option>
                                        <option value="Unidentifiable/fragment">Unidentifiable/fragment</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="town" class="form-label">Town</label>
                                    <input type="text" class="form-control" id="town" name="town">
                                </div>
                                <div class="mb-3">
                                    <label for="rism_link" class="form-label">RISM URL</label>
                                    <input type="url" class="form-control" id="rism_link" name="rism_link">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="catalogued" name="catalogued">
                                    <label class="form-check-label" for="catalogued">Catalogued</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Inclusions Section -->
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Inclusions</h5>
                    <button type="button" class="btn btn-sm btn-primary" id="addInclusionBtn">
                        <i class="bi bi-plus-lg"></i> Add Inclusion
                    </button>
                </div>
                <div class="card-body">
                    <!-- Inclusions will be loaded here -->
                    <div id="inclusionsContainer">
                        <div class="text-center py-4 text-muted">
                            Loading inclusions...
                        </div>
                    </div>
                    
                    <!-- Pagination -->
                    <div id="inclusionsPagination" class="d-flex justify-content-center mt-3"></div>
                </div>
            </div>

            <!-- Save Button -->
            <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-success btn-lg" id="saveAllBtn">
                    <i class="bi bi-check-lg"></i> Save All Changes
                </button>
            </div>
        </div>

        <!-- Save Progress Modal -->
        <div class="modal fade" id="saveProgressModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Saving Changes</h5>
                    </div>
                    <div class="modal-body">
                        <div class="text-center">
                            <div class="spinner-border mb-3" role="status">
                                <span class="visually-hidden">Saving...</span>
                            </div>
                            <p id="saveStatusText">Processing source and inclusion data...</p>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar" style="width: 0%" id="saveProgressBar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let sourceData = {};
        let inclusionsData = [];
        let currentPage = 1;
        const pageSize = 40;

        // Fetch source details and inclusions
        async function fetchSource() {
            const urlParams = new URLSearchParams(window.location.search);
            const sourceId = urlParams.get('id');

            if (!sourceId) {
                alert('No source ID provided');
                return;
            }

            try {
                const response = await fetch(`/api/sources/${sourceId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch source details');
                }
                const data = await response.json();
                
                sourceData = data.source;
                inclusionsData = data.inclusions || [];
                
                // Populate source form
                populateSourceForm();
                
                // Display inclusions
                displayInclusions();
                
                // Show main content
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <div class="alert alert-danger">
                        <h4>Error Loading Source</h4>
                        <p>Failed to load source details. Please try again.</p>
                        <a href="index.html" class="btn btn-outline-secondary">Back to Sources</a>
                    </div>
                `;
            }
        }

        function populateSourceForm() {
            document.getElementById('source_id').value = sourceData.id;
            document.getElementById('code').value = sourceData.code || '';
            document.getElementById('title').value = sourceData.title || '';
            document.getElementById('type').value = sourceData.type || '';
            document.getElementById('format').value = sourceData.format || '';
            document.getElementById('town').value = sourceData.town || '';
            document.getElementById('rism_link').value = sourceData.rism_link || '';
            document.getElementById('catalogued').checked = sourceData.catalogued || false;
        }

        function displayInclusions() {
            const container = document.getElementById('inclusionsContainer');
            
            if (inclusionsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-muted">
                        <p>No inclusions found for this source.</p>
                        <button type="button" class="btn btn-outline-primary" onclick="addInclusion()">
                            <i class="bi bi-plus-lg"></i> Add First Inclusion
                        </button>
                    </div>
                `;
                return;
            }

            // Start building the inclusions table
            let html = `
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th width="80">Order</th>
                                <th>Composition</th>
                                <th width="150">Type</th>
                                <th width="200">Composers</th>
                                <th width="150">Clefs</th>
                                <th width="100">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            inclusionsData.forEach((inclusion, index) => {
                html += `
                    <tr data-inclusion-id="${inclusion.id}">
                        <td>
                            <input type="number" class="form-control form-control-sm" 
                                   value="${inclusion.position || index + 1}" 
                                   onchange="updateInclusionOrder(${index}, this.value)">
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm" 
                                   value="${inclusion.composition_name || ''}" 
                                   placeholder="Composition title"
                                   onchange="updateInclusionField(${index}, 'composition_name', this.value)">
                        </td>
                        <td>
                            <select class="form-control form-control-sm" 
                                    onchange="updateInclusionField(${index}, 'composition_type', this.value)">
                                <option value="">Select type...</option>
                                <option value="Mass" ${inclusion.composition_type === 'Mass' ? 'selected' : ''}>Mass</option>
                                <option value="Motet" ${inclusion.composition_type === 'Motet' ? 'selected' : ''}>Motet</option>
                                <option value="Song" ${inclusion.composition_type === 'Song' ? 'selected' : ''}>Song</option>
                            </select>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm" 
                                   value="${inclusion.composers ? inclusion.composers.map(c => c.name).join(', ') : ''}" 
                                   placeholder="Composer names"
                                   onchange="updateInclusionField(${index}, 'composers', this.value)">
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm" 
                                   value="${inclusion.clefs || ''}" 
                                   placeholder="Clefs"
                                   onchange="updateInclusionField(${index}, 'clefs', this.value)">
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-danger" 
                                    onclick="removeInclusion(${index})" title="Remove inclusion">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function updateInclusionOrder(index, value) {
            inclusionsData[index].position = parseInt(value);
        }

        function updateInclusionField(index, field, value) {
            inclusionsData[index][field] = value;
        }

        function addInclusion() {
            const newInclusion = {
                id: null, // new inclusion
                position: inclusionsData.length + 1,
                composition_name: '',
                composition_type: '',
                composers: '',
                clefs: ''
            };
            inclusionsData.push(newInclusion);
            displayInclusions();
        }

        function removeInclusion(index) {
            if (confirm('Are you sure you want to remove this inclusion?')) {
                inclusionsData.splice(index, 1);
                displayInclusions();
            }
        }

        // Save all changes
        async function saveAllChanges() {
            const modal = new bootstrap.Modal(document.getElementById('saveProgressModal'));
            modal.show();

            try {
                // Collect source data
                const formData = new FormData(document.getElementById('editSourceForm'));
                const sourceData = Object.fromEntries(formData);
                sourceData.catalogued = document.getElementById('catalogued').checked;

                // Prepare data for saving
                const saveData = {
                    source: sourceData,
                    inclusions: inclusionsData
                };

                document.getElementById('saveStatusText').textContent = 'Saving source data...';
                document.getElementById('saveProgressBar').style.width = '25%';

                const sourceId = document.getElementById('source_id').value;
                const response = await fetch(`/api/sources/${sourceId}/save-with-inclusions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(saveData)
                });

                document.getElementById('saveProgressBar').style.width = '75%';
                document.getElementById('saveStatusText').textContent = 'Processing inclusions and compositions...';

                if (!response.ok) {
                    throw new Error('Failed to save changes');
                }

                document.getElementById('saveProgressBar').style.width = '100%';
                document.getElementById('saveStatusText').textContent = 'Save completed successfully!';

                setTimeout(() => {
                    modal.hide();
                    alert('Changes saved successfully!');
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Error saving:', error);
                modal.hide();
                alert('Failed to save changes. Please try again.');
            }
        }

        // Event listeners
        document.getElementById('addInclusionBtn').addEventListener('click', addInclusion);
        document.getElementById('saveAllBtn').addEventListener('click', saveAllChanges);

        // Initialize
        fetchSource();
    </script>
</body>
</html>
