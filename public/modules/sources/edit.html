<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Source - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Edit Source</h1>
                <p class="text-muted">Update source details</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Sources
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editSourceForm">
                    <input type="hidden" id="source_id">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="code" class="form-label">Code *</label>
                                <input type="text" class="form-control" id="code" name="code" required>
                            </div>
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title">
                            </div>
                            <div class="mb-3">
                                <label for="type" class="form-label">Type</label>
                                <select class="form-control" id="type" name="type">
                                    <option value="">Select Type</option>
                                    <option value="MS">MS</option>
                                    <option value="Print">Print</option>
                                    <option value="Print/MS">Print/MS</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="format" class="form-label">Format</label>
                                <select class="form-control" id="format" name="format">
                                    <option value="">Select Format</option>
                                    <option value="Choirbook">Choirbook</option>
                                    <option value="Partbook">Partbook</option>
                                    <option value="Score">Score</option>
                                    <option value="Tablature">Tablature</option>
                                    <option value="Tablebook">Tablebook</option>
                                    <option value="Multiple_choirbooks">Multiple choirbooks</option>
                                    <option value="Choirbook/score">Choirbook/score</option>
                                    <option value="Partbook/score">Partbook/score</option>
                                    <option value="Unidentifiable/fragment">Unidentifiable/fragment</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="town" class="form-label">Town</label>
                                <input type="text" class="form-control" id="town" name="town">
                            </div>
                            <div class="mb-3">
                                <label for="rism_link" class="form-label">RISM URL</label>
                                <input type="url" class="form-control" id="rism_link" name="rism_link">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="catalogued" name="catalogued">
                                <label class="form-check-label" for="catalogued">Catalogued</label>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="index.html" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch source details
        async function fetchSource() {
            const urlParams = new URLSearchParams(window.location.search);
            const sourceId = urlParams.get('id');
            
            if (!sourceId) {
                alert('No source ID provided');
                return;
            }

            try {
                const response = await fetch(`/api/sources/${sourceId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch source details');
                }
                const data = await response.json();
                const source = data.source;
                
                // Populate form fields
                document.getElementById('source_id').value = source.id;
                document.getElementById('code').value = source.code || '';
                document.getElementById('title').value = source.title || '';
                document.getElementById('type').value = source.type || '';
                document.getElementById('format').value = source.format || '';
                document.getElementById('town').value = source.town || '';
                document.getElementById('rism_link').value = source.rism_link || '';
                document.getElementById('catalogued').checked = source.catalogued || false;
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load source details. Please try again.');
            }
        }

        // Handle form submission
        document.getElementById('editSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sourceId = document.getElementById('source_id').value;
            const formData = {
                code: document.getElementById('code').value,
                title: document.getElementById('title').value,
                type: document.getElementById('type').value,
                format: document.getElementById('format').value,
                town: document.getElementById('town').value,
                rism_link: document.getElementById('rism_link').value,
                catalogued: document.getElementById('catalogued').checked
            };

            try {
                const response = await fetch(`/api/sources/${sourceId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update source');
                }

                alert('Source updated successfully');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update source. Please try again.');
            }
        });

        // Initialize
        fetchSource();
    </script>
</body>
</html>
