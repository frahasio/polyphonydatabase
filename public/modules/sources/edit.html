<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Source - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Edit Source</h1>
                <p class="text-muted">Update source details</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
                <button class="btn btn-danger" id="deleteButton">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editSourceForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="code" class="form-label">Code *</label>
                            <input type="text" class="form-control" id="code" name="code" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="type" class="form-label">Type</label>
                            <input type="text" class="form-control" id="type" name="type">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <textarea class="form-control" id="title" name="title" rows="2"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="format" class="form-label">Format</label>
                            <input type="text" class="form-control" id="format" name="format">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="town" class="form-label">Town</label>
                            <input type="text" class="form-control" id="town" name="town">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="fromYear" class="form-label">From Year</label>
                            <input type="number" class="form-control" id="fromYear" name="fromYear">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="fromYearAnnotation" class="form-label">From Year Annotation</label>
                            <input type="text" class="form-control" id="fromYearAnnotation" name="fromYearAnnotation" placeholder="e.g. c., after, before">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="toYear" class="form-label">To Year</label>
                            <input type="number" class="form-control" id="toYear" name="toYear">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="toYearAnnotation" class="form-label">To Year Annotation</label>
                            <input type="text" class="form-control" id="toYearAnnotation" name="toYearAnnotation" placeholder="e.g. c., after, before">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="dates" class="form-label">Dates</label>
                        <input type="text" class="form-control" id="dates" name="dates" placeholder="e.g. c.1580–after 1623">
                    </div>

                    <div class="mb-3">
                        <label for="locationAndPubsubscribe" class="form-label">Location and Publication Details</label>
                        <input type="text" class="form-control" id="locationAndPubsubscribe" name="locationAndPubsubscribe">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="rismLink" class="form-label">RISM Link</label>
                            <input type="url" class="form-control" id="rismLink" name="rismLink">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="url" class="form-label">URL</label>
                            <input type="url" class="form-control" id="url" name="url">
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="catalogued" name="catalogued">
                        <label class="form-check-label" for="catalogued">Catalogued</label>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this source? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let sourceId;

        // Get source ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        sourceId = urlParams.get('id');

        if (!sourceId) {
            window.location.href = 'index.html';
        }

        // Fetch source details
        async function fetchSource() {
            try {
                const response = await fetch(`/sources/${sourceId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch source');
                }
                const source = await response.json();
                populateForm(source);
            } catch (error) {
                console.error('Error fetching source:', error);
                alert('Failed to load source details. Please try again.');
                window.location.href = 'index.html';
            }
        }

        // Populate form with source data
        function populateForm(source) {
            document.getElementById('code').value = source.code || '';
            document.getElementById('title').value = source.title || '';
            document.getElementById('type').value = source.type || '';
            document.getElementById('format').value = source.format || '';
            document.getElementById('town').value = source.town || '';
            document.getElementById('rismLink').value = source.rismLink || '';
            document.getElementById('url').value = source.url || '';
            document.getElementById('catalogued').checked = source.catalogued || false;
            document.getElementById('fromYear').value = source.fromYear || '';
            document.getElementById('toYear').value = source.toYear || '';
            document.getElementById('fromYearAnnotation').value = source.fromYearAnnotation || '';
            document.getElementById('toYearAnnotation').value = source.toYearAnnotation || '';
            document.getElementById('dates').value = source.dates || '';
            document.getElementById('locationAndPubsubscribe').value = source.locationAndPubsubscribe || '';
        }

        // Handle form submission
        document.getElementById('editSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Convert checkbox value to boolean
            data.catalogued = formData.get('catalogued') === 'on';

            try {
                const response = await fetch(`/sources/${sourceId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Failed to update source');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error updating source:', error);
                alert('Failed to update source. Please try again.');
            }
        });

        // Handle delete
        document.getElementById('deleteButton').addEventListener('click', () => {
            const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        });

        document.getElementById('confirmDelete').addEventListener('click', async () => {
            try {
                const response = await fetch(`/sources/${sourceId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete source');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error deleting source:', error);
                alert('Failed to delete source. Please try again.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchSource);
    </script>
</body>
</html>
