<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Source - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Edit Source</h1>
                <p class="text-muted">Update source details</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-arrow-left"></i> Back to List
                </a>
                <button class="btn btn-danger" id="deleteButton">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="editSourceForm">
                    <div class="mb-3">
                        <label for="code" class="form-label">Code *</label>
                        <input type="text" class="form-control" id="code" name="code" required>
                    </div>

                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <textarea class="form-control" id="title" name="title" rows="2"></textarea>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">From Year</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="fromYearAnnotation" name="fromYearAnnotation" placeholder="Annotation">
                                <input type="number" class="form-control" id="fromYear" name="fromYear" placeholder="Year">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">To Year</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="toYearAnnotation" name="toYearAnnotation" placeholder="Annotation">
                                <input type="number" class="form-control" id="toYear" name="toYear" placeholder="Year">
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="town" class="form-label">Town</label>
                            <input type="text" class="form-control" id="town" name="town">
                        </div>
                        <div class="col-md-4">
                            <label for="type" class="form-label">Type</label>
                            <select class="form-control" id="type" name="type">
                                <option value="">Select Type</option>
                                <option value="MS">MS</option>
                                <option value="Print">Print</option>
                                <option value="Print/MS">Print/MS</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="format" class="form-label">Format</label>
                            <select class="form-control" id="format" name="format">
                                <option value="">Select Format</option>
                                <option value="Choirbook">Choirbook</option>
                                <option value="Partbook">Partbook</option>
                                <option value="Score">Score</option>
                                <option value="Tablature">Tablature</option>
                                <option value="Tablebook">Tablebook</option>
                                <option value="Multiple_choirbooks">Multiple choirbooks</option>
                                <option value="Choirbook/score">Choirbook/score</option>
                                <option value="Partbook/score">Partbook/score</option>
                                <option value="Unidentifiable/fragment">Unidentifiable/fragment</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="rismLink" class="form-label">RISM URL</label>
                            <input type="url" class="form-control" id="rismLink" name="rismLink">
                        </div>
                        <div class="col-md-6">
                            <label for="url" class="form-label">Images URL</label>
                            <input type="url" class="form-control" id="url" name="url">
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="catalogued" name="catalogued">
                        <label class="form-check-label" for="catalogued">Catalogued</label>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="publishers" class="form-label">Publishers</label>
                            <select class="form-select" id="publishers" name="publishers" multiple>
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="scribes" class="form-label">Scribes</label>
                            <select class="form-select" id="scribes" name="scribes" multiple>
                                <!-- Will be populated dynamically -->
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="index.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this source? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        let sourceId;
        let publishers = [];
        let scribes = [];

        // Get source ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        sourceId = urlParams.get('id');

        if (!sourceId) {
            window.location.href = 'index.html';
        }

        // Initialize Select2 for multiple selects
        $('#publishers').select2({
            theme: 'bootstrap-5',
            placeholder: 'Select publishers',
            allowClear: true
        });

        $('#scribes').select2({
            theme: 'bootstrap-5',
            placeholder: 'Select scribes',
            allowClear: true
        });

        // Fetch publishers and scribes
        async function fetchPublishersAndScribes() {
            try {
                const [publishersResponse, scribesResponse] = await Promise.all([
                    fetch('/publishers'),
                    fetch('/scribes')
                ]);

                if (!publishersResponse.ok || !scribesResponse.ok) {
                    throw new Error('Failed to fetch data');
                }

                const publishersData = await publishersResponse.json();
                const scribesData = await scribesResponse.json();

                publishers = publishersData.publishers;
                scribes = scribesData.scribes;

                populateSelects();
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('Failed to load publishers and scribes. Please try again.');
            }
        }

        // Populate select elements
        function populateSelects() {
            const publishersSelect = document.getElementById('publishers');
            const scribesSelect = document.getElementById('scribes');

            publishers.forEach(publisher => {
                const option = new Option(publisher.name, publisher.id);
                publishersSelect.add(option);
            });

            scribes.forEach(scribe => {
                const option = new Option(scribe.name, scribe.id);
                scribesSelect.add(option);
            });
        }

        // Fetch source details
        async function fetchSource() {
            try {
                const response = await fetch(`/sources/${sourceId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch source');
                }
                const source = await response.json();
                populateForm(source);
            } catch (error) {
                console.error('Error fetching source:', error);
                alert('Failed to load source details. Please try again.');
                window.location.href = 'index.html';
            }
        }

        // Populate form with source data
        function populateForm(source) {
            document.getElementById('code').value = source.code || '';
            document.getElementById('title').value = source.title || '';
            document.getElementById('type').value = source.type || '';
            document.getElementById('format').value = source.format || '';
            document.getElementById('town').value = source.town || '';
            document.getElementById('rismLink').value = source.rismLink || '';
            document.getElementById('url').value = source.url || '';
            document.getElementById('catalogued').checked = source.catalogued || false;
            document.getElementById('fromYear').value = source.fromYear || '';
            document.getElementById('toYear').value = source.toYear || '';
            document.getElementById('fromYearAnnotation').value = source.fromYearAnnotation || '';
            document.getElementById('toYearAnnotation').value = source.toYearAnnotation || '';

            // Set selected publishers and scribes
            if (source.publishers) {
                const publisherIds = source.publishers.map(p => p.id);
                const publishersSelect = document.getElementById('publishers');
                Array.from(publishersSelect.options).forEach(option => {
                    option.selected = publisherIds.includes(parseInt(option.value));
                });
            }

            if (source.scribes) {
                const scribeIds = source.scribes.map(s => s.id);
                const scribesSelect = document.getElementById('scribes');
                Array.from(scribesSelect.options).forEach(option => {
                    option.selected = scribeIds.includes(parseInt(option.value));
                });
            }
        }

        // Handle form submission
        document.getElementById('editSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Convert checkbox value to boolean
            data.catalogued = formData.get('catalogued') === 'on';

            // Get selected publishers and scribes
            const publishersSelect = document.getElementById('publishers');
            const scribesSelect = document.getElementById('scribes');
            data.publisherIds = Array.from(publishersSelect.selectedOptions).map(option => parseInt(option.value));
            data.scribeIds = Array.from(scribesSelect.selectedOptions).map(option => parseInt(option.value));

            try {
                const response = await fetch(`/sources/${sourceId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Failed to update source');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error updating source:', error);
                alert('Failed to update source. Please try again.');
            }
        });

        // Handle delete
        document.getElementById('deleteButton').addEventListener('click', () => {
            const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        });

        document.getElementById('confirmDelete').addEventListener('click', async () => {
            try {
                const response = await fetch(`/sources/${sourceId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete source');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error deleting source:', error);
                alert('Failed to delete source. Please try again.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchPublishersAndScribes();
            fetchSource();
        });
    </script>
</body>
</html>
