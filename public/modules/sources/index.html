<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Sources</h1>
                <p class="text-muted">Manage musical sources</p>
            </div>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <input type="text" class="form-control" id="filterInput" placeholder="Filter sources...">
            </div>
        </div>

        <!-- Sources List -->
        <div class="card">
            <div class="card-body">
                <div class="list-group" id="sourcesList">
                    <div class="text-center text-muted">Loading sources...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display sources
        async function fetchSources() {
            try {
                const response = await fetch('/sources');
                const data = await response.json();
                
                if (data.sources && Array.isArray(data.sources)) {
                    displaySources(data.sources);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error fetching sources:', error);
                document.getElementById('sourcesList').innerHTML = `
                    <div class="text-center text-danger">
                        Failed to load sources. Please try again later.
                    </div>
                `;
            }
        }

        // Display sources in the list
        function displaySources(sources) {
            const list = document.getElementById('sourcesList');
            if (sources.length === 0) {
                list.innerHTML = `
                    <div class="text-center text-muted">No sources found</div>
                `;
                return;
            }

            // Sort sources by code
            sources.sort((a, b) => a.code.localeCompare(b.code));

            list.innerHTML = sources.map(source => `
                <a href="edit.html?id=${source.id}" class="list-group-item list-group-item-action ${!source.catalogued ? 'list-group-item-warning' : ''}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="font-monospace fw-medium">${source.code}</span>
                                <span class="text-muted">${getYearDisplay(source)}</span>
                            </div>
                            <div class="text-muted small mt-1">${truncateText(source.title, 100)}</div>
                        </div>
                        ${!source.catalogued ? 
                            '<span class="badge bg-warning text-dark">Needs Cataloguing</span>' : 
                            ''}
                    </div>
                </a>
            `).join('');
        }

        // Helper function to get year display
        function getYearDisplay(source) {
            if (source.from_year && source.to_year) {
                return `${source.from_year}-${source.to_year}`;
            } else if (source.from_year) {
                return source.from_year.toString();
            } else if (source.to_year) {
                return source.to_year.toString();
            }
            return '';
        }

        // Helper function to truncate text
        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // Filter sources
        function filterSources() {
            const filter = document.getElementById('filterInput').value.toLowerCase();
            const items = document.querySelectorAll('#sourcesList .list-group-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchSources();
            document.getElementById('filterInput').addEventListener('input', filterSources);
        });
    </script>
</body>
</html>
