<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Sources</h1>
                <p class="text-muted">Manage musical sources, including manuscripts, prints, and recordings</p>
            </div>
            <div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSourceModal">
                    <i class="bi bi-plus-lg"></i> Add New Source
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="typeFilter" class="form-label">Source Type</label>
                        <select class="form-select" id="typeFilter">
                            <option value="">All Types</option>
                            <option value="manuscript">Manuscript</option>
                            <option value="print">Print</option>
                            <option value="recording">Recording</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="dateFrom" class="form-label">Date From</label>
                        <input type="number" class="form-control" id="dateFrom" placeholder="Year">
                    </div>
                    <div class="col-md-3">
                        <label for="dateTo" class="form-label">Date To</label>
                        <input type="number" class="form-control" id="dateTo" placeholder="Year">
                    </div>
                    <div class="col-md-3">
                        <label for="locationFilter" class="form-label">Location</label>
                        <input type="text" class="form-control" id="locationFilter" placeholder="Search location">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sources Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Date</th>
                                <th>Location</th>
                                <th>Shelfmark</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="sourcesTableBody">
                            <tr>
                                <td colspan="6" class="text-center">Loading sources...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Source Modal -->
    <div class="modal fade" id="addSourceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Source</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addSourceForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="type" class="form-label">Type</label>
                                <select class="form-select" id="type" required>
                                    <option value="manuscript">Manuscript</option>
                                    <option value="print">Print</option>
                                    <option value="recording">Recording</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="date" class="form-label">Date</label>
                                <input type="number" class="form-control" id="date" placeholder="Year">
                            </div>
                            <div class="col-md-6">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location">
                            </div>
                            <div class="col-md-6">
                                <label for="shelfmark" class="form-label">Shelfmark</label>
                                <input type="text" class="form-control" id="shelfmark">
                            </div>
                            <div class="col-12">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" id="notes" rows="3"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveSourceBtn">Save Source</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display sources
        async function fetchSources() {
            try {
                const response = await fetch('/sources');
                const data = await response.json();
                
                if (data.sources && Array.isArray(data.sources)) {
                    displaySources(data.sources);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error fetching sources:', error);
                document.getElementById('sourcesTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">
                            Failed to load sources. Please try again later.
                        </td>
                    </tr>
                `;
            }
        }

        // Display sources in the table
        function displaySources(sources) {
            const tbody = document.getElementById('sourcesTableBody');
            if (sources.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">No sources found</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = sources.map(source => `
                <tr>
                    <td>${source.name}</td>
                    <td>${source.type}</td>
                    <td>${source.date || '-'}</td>
                    <td>${source.location || '-'}</td>
                    <td>${source.shelfmark || '-'}</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <a href="edit.html?id=${source.id}" class="btn btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-outline-danger" onclick="deleteSource(${source.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Add new source
        async function addSource(sourceData) {
            try {
                const response = await fetch('/sources', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(sourceData)
                });

                if (!response.ok) {
                    throw new Error('Failed to add source');
                }

                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Error adding source:', error);
                throw error;
            }
        }

        // Delete source
        async function deleteSource(id) {
            if (!confirm('Are you sure you want to delete this source?')) {
                return;
            }

            try {
                const response = await fetch(`/sources/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete source');
                }

                // Refresh the sources list
                fetchSources();
            } catch (error) {
                console.error('Error deleting source:', error);
                alert('Failed to delete source. Please try again.');
            }
        }

        // Filter sources
        function filterSources() {
            const type = document.getElementById('typeFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const location = document.getElementById('locationFilter').value.toLowerCase();

            const rows = document.querySelectorAll('#sourcesTableBody tr');
            rows.forEach(row => {
                const cells = row.cells;
                if (cells.length === 0) return;

                const sourceType = cells[1].textContent;
                const sourceDate = parseInt(cells[2].textContent) || 0;
                const sourceLocation = cells[3].textContent.toLowerCase();

                const typeMatch = !type || sourceType === type;
                const dateMatch = (!dateFrom || sourceDate >= parseInt(dateFrom)) && 
                                (!dateTo || sourceDate <= parseInt(dateTo));
                const locationMatch = !location || sourceLocation.includes(location);

                row.style.display = typeMatch && dateMatch && locationMatch ? '' : 'none';
            });
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            fetchSources();

            // Filter event listeners
            document.getElementById('typeFilter').addEventListener('change', filterSources);
            document.getElementById('dateFrom').addEventListener('input', filterSources);
            document.getElementById('dateTo').addEventListener('input', filterSources);
            document.getElementById('locationFilter').addEventListener('input', filterSources);

            // Add source form submission
            document.getElementById('saveSourceBtn').addEventListener('click', async () => {
                const form = document.getElementById('addSourceForm');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const sourceData = {
                    name: document.getElementById('name').value,
                    type: document.getElementById('type').value,
                    date: document.getElementById('date').value || null,
                    location: document.getElementById('location').value || null,
                    shelfmark: document.getElementById('shelfmark').value || null,
                    notes: document.getElementById('notes').value || null
                };

                try {
                    await addSource(sourceData);
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addSourceModal'));
                    modal.hide();
                    form.reset();
                    fetchSources();
                } catch (error) {
                    alert('Failed to add source. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
