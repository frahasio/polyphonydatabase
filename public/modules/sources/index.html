<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources - Polyphony Database</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Sources</h1>
                <p class="text-muted">Manage musical sources</p>
            </div>
            <div>
                <a href="/" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-house"></i> Back to Home
                </a>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSourceModal">
                    <i class="bi bi-plus-lg"></i> Add Source
                </button>
            </div>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="filterInput" placeholder="Search by code or title (minimum 2 characters)...">
                    <button class="btn btn-outline-secondary" type="button" id="clearFilter">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sources List -->
        <div class="card">
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Format</th>
                            <th>Town</th>
                            <th>Catalogued</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sourcesTableBody">
                        <!-- Will be populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Source Modal -->
    <div class="modal fade" id="addSourceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Source</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addSourceForm">
                        <div class="mb-3">
                            <label for="code" class="form-label">Code *</label>
                            <input type="text" class="form-control" id="code" name="code" required>
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title">
                        </div>
                        <div class="mb-3">
                            <label for="type" class="form-label">Type</label>
                            <select class="form-control" id="type" name="type">
                                <option value="">Select Type</option>
                                <option value="MS">MS</option>
                                <option value="Print">Print</option>
                                <option value="Print/MS">Print/MS</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="format" class="form-label">Format</label>
                            <select class="form-control" id="format" name="format">
                                <option value="">Select Format</option>
                                <option value="Choirbook">Choirbook</option>
                                <option value="Partbook">Partbook</option>
                                <option value="Score">Score</option>
                                <option value="Tablature">Tablature</option>
                                <option value="Tablebook">Tablebook</option>
                                <option value="Multiple_choirbooks">Multiple choirbooks</option>
                                <option value="Choirbook/score">Choirbook/score</option>
                                <option value="Partbook/score">Partbook/score</option>
                                <option value="Unidentifiable/fragment">Unidentifiable/fragment</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="town" class="form-label">Town</label>
                            <input type="text" class="form-control" id="town" name="town">
                        </div>
                        <div class="mb-3">
                            <label for="rismLink" class="form-label">RISM URL</label>
                            <input type="url" class="form-control" id="rismLink" name="rismLink">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="catalogued" name="catalogued">
                            <label class="form-check-label" for="catalogued">Catalogued</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="addSourceBtn">Add Source</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let searchTimeout;

        // Fetch and display sources
        async function fetchSources(searchTerm = '') {
            try {
                const response = await fetch(`/api/sources${searchTerm ? `?search=${encodeURIComponent(searchTerm)}` : ''}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch sources');
                }
                const data = await response.json();
                const tbody = document.getElementById('sourcesTableBody');
                
                // Build HTML string in one go
                const html = data.sources.map(source => `
                    <tr class="${source.catalogued ? 'table-success' : ''}">
                        <td>${source.code}</td>
                        <td>${source.title || ''}</td>
                        <td>${source.type || ''}</td>
                        <td>${source.format || ''}</td>
                        <td>${source.town || ''}</td>
                        <td>${source.catalogued ? '<i class="bi bi-check-circle-fill text-success"></i>' : ''}</td>
                        <td>
                            <a href="edit.html?id=${source.id}" class="btn btn-sm btn-outline-primary me-2">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSource(${source.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                
                // Set innerHTML once
                tbody.innerHTML = html;
            } catch (error) {
                console.error('Error fetching sources:', error);
                alert('Failed to load sources. Please try again.');
            }
        }

        // Handle search input
        document.getElementById('filterInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.trim();
            
            // Clear any existing timeout
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }

            // Only search if we have at least 2 characters or empty
            if (searchTerm.length >= 2 || searchTerm.length === 0) {
                searchTimeout = setTimeout(() => {
                    fetchSources(searchTerm);
                }, 300); // Debounce for 300ms
            }
        });

        // Clear filter
        document.getElementById('clearFilter').addEventListener('click', () => {
            document.getElementById('filterInput').value = '';
            fetchSources();
        });

        // Handle form submission
        document.getElementById('addSourceBtn').addEventListener('click', async () => {
            const form = document.getElementById('addSourceForm');
            const formData = new FormData(form);
            
            // Convert form data to object
            const data = {
                code: formData.get('code'),
                title: formData.get('title'),
                type: formData.get('type'),
                format: formData.get('format'),
                town: formData.get('town'),
                rism_link: formData.get('rismLink'),
                catalogued: formData.get('catalogued') === 'on'
            };

            try {
                const response = await fetch('/api/sources', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Failed to create source');
                }

                // Close modal and refresh list
                const modal = bootstrap.Modal.getInstance(document.getElementById('addSourceModal'));
                modal.hide();
                form.reset();
                fetchSources();
            } catch (error) {
                console.error('Error creating source:', error);
                alert('Failed to create source. Please try again.');
            }
        });

        // Handle delete
        async function deleteSource(id) {
            if (!confirm('Are you sure you want to delete this source?')) {
                return;
            }

            try {
                const response = await fetch(`/api/sources/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete source');
                }

                fetchSources();
            } catch (error) {
                console.error('Error deleting source:', error);
                alert('Failed to delete source. Please try again.');
            }
        }

        // Initial load
        fetchSources();
    </script>
</body>
</html>
