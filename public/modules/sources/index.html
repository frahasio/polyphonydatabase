<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources - Polyphony Database</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Sources</h1>
                <p class="text-muted">Manage musical sources</p>
            </div>
            <div>
                <a href="edit.html" target="_blank" class="btn btn-primary" title="Add a new source (opens in new tab)">
                    <i class="bi bi-plus-lg"></i> Add Source
                </a>
            </div>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <div class="input-group">
                            <input type="text" class="form-control" id="filterInput" placeholder="Search by code or title (minimum 2 characters)...">
                            <button class="btn btn-outline-secondary" type="button" id="clearFilter">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-outline-warning w-100" type="button" id="uncataloguedFilter">
                            <i class="bi bi-funnel"></i> Show Uncatalogued Only
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sources List -->
        <div class="card">
            <div class="card-body">
                <div id="paginationTop" class="d-flex justify-content-between align-items-center mb-3" style="display: none !important;"></div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Format</th>
                            <th>Town</th>
                            <th>Catalogued</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sourcesTableBody">
                        <!-- Will be populated dynamically -->
                    </tbody>
                </table>
                <div id="paginationBottom" class="d-flex justify-content-between align-items-center mt-3" style="display: none !important;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let searchTimeout;
        let showUncataloguedOnly = false;
        let currentPage = 1;
        const pageSize = 50;

        async function fetchSources(searchTerm = '', page = 1) {
            currentPage = page;
            const tbody = document.getElementById('sourcesTableBody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-3"><div class="spinner-border spinner-border-sm" role="status"></div> Loading...</td></tr>';

            try {
                const url = new URL('/api/admin/sources', window.location.origin);
                if (searchTerm) {
                    url.searchParams.append('search', searchTerm);
                }
                if (showUncataloguedOnly) {
                    url.searchParams.append('catalogued', 'false');
                }
                url.searchParams.append('page', page);
                url.searchParams.append('limit', pageSize);
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Failed to fetch sources');
                }
                const data = await response.json();
                const pagination = data.pagination;
                
                const html = data.sources.map(source => `
                    <tr class="${source.catalogued ? 'table-success' : ''}">
                        <td>${source.code}</td>
                        <td>${source.title || ''}</td>
                        <td>${source.type || ''}</td>
                        <td>${source.format || ''}</td>
                        <td>${source.town || ''}</td>
                        <td>${source.catalogued ? '<i class="bi bi-check-circle-fill text-success"></i>' : '<i class="bi bi-exclamation-triangle-fill text-warning" title="Needs cataloguing"></i>'}</td>
                        <td>
                            <a href="edit.html?id=${source.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this source (opens in new tab)">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSource(${source.id})" title="Delete this source">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                
                tbody.innerHTML = html || '<tr><td colspan="7" class="text-center text-muted py-3">No sources found</td></tr>';

                renderPagination(pagination, searchTerm);
            } catch (error) {
                console.error('Error fetching sources:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">Failed to load sources. Please try again.</td></tr>';
            }
        }

        function renderPagination(pagination, searchTerm) {
            if (!pagination || pagination.totalPages <= 1) {
                document.getElementById('paginationTop').style.display = 'none';
                document.getElementById('paginationBottom').style.display = 'none';
                if (pagination) {
                    document.getElementById('paginationTop').style.display = '';
                    document.getElementById('paginationTop').innerHTML = `<small class="text-muted">${pagination.total} source${pagination.total !== 1 ? 's' : ''}</small><span></span>`;
                }
                return;
            }

            const { page, totalPages, total } = pagination;
            const start = (page - 1) * pageSize + 1;
            const end = Math.min(page * pageSize, total);

            const info = `<small class="text-muted">Showing ${start}–${end} of ${total} sources</small>`;

            let buttons = '';
            buttons += `<button class="btn btn-sm btn-outline-secondary" ${page <= 1 ? 'disabled' : ''} onclick="goToPage(${page - 1}, '${searchTerm.replace(/'/g, "\\'")}')"><i class="bi bi-chevron-left"></i></button>`;

            const maxButtons = 7;
            let startPage = Math.max(1, page - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            if (startPage > 1) {
                buttons += `<button class="btn btn-sm btn-outline-secondary" onclick="goToPage(1, '${searchTerm.replace(/'/g, "\\'")}')">1</button>`;
                if (startPage > 2) buttons += `<span class="px-1 text-muted">...</span>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                buttons += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-outline-secondary'}" onclick="goToPage(${i}, '${searchTerm.replace(/'/g, "\\'")}')">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) buttons += `<span class="px-1 text-muted">...</span>`;
                buttons += `<button class="btn btn-sm btn-outline-secondary" onclick="goToPage(${totalPages}, '${searchTerm.replace(/'/g, "\\'")}')"> ${totalPages}</button>`;
            }

            buttons += `<button class="btn btn-sm btn-outline-secondary" ${page >= totalPages ? 'disabled' : ''} onclick="goToPage(${page + 1}, '${searchTerm.replace(/'/g, "\\'")}')"><i class="bi bi-chevron-right"></i></button>`;

            const paginationHtml = `${info}<div class="btn-group">${buttons}</div>`;

            document.getElementById('paginationTop').innerHTML = paginationHtml;
            document.getElementById('paginationTop').style.display = '';
            document.getElementById('paginationBottom').innerHTML = paginationHtml;
            document.getElementById('paginationBottom').style.display = '';
        }

        function goToPage(page, searchTerm) {
            fetchSources(searchTerm, page);
        }

        // Handle search input
        document.getElementById('filterInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.trim();
            
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }

            if (searchTerm.length >= 2 || searchTerm.length === 0) {
                searchTimeout = setTimeout(() => {
                    fetchSources(searchTerm, 1);
                }, 300);
            }
        });

        // Clear filter
        document.getElementById('clearFilter').addEventListener('click', () => {
            document.getElementById('filterInput').value = '';
            showUncataloguedOnly = false;
            updateUncataloguedFilterButton();
            fetchSources('', 1);
        });

        // Uncatalogued filter toggle
        document.getElementById('uncataloguedFilter').addEventListener('click', () => {
            showUncataloguedOnly = !showUncataloguedOnly;
            updateUncataloguedFilterButton();
            fetchSources(document.getElementById('filterInput').value.trim(), 1);
        });

        function updateUncataloguedFilterButton() {
            const button = document.getElementById('uncataloguedFilter');
            if (showUncataloguedOnly) {
                button.className = 'btn btn-warning w-100';
                button.innerHTML = '<i class="bi bi-funnel-fill"></i> Showing Uncatalogued Only';
            } else {
                button.className = 'btn btn-outline-warning w-100';
                button.innerHTML = '<i class="bi bi-funnel"></i> Show Uncatalogued Only';
            }
        }

        async function deleteSource(id) {
            if (!confirm('Are you sure you want to delete this source?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/sources/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete source');
                }

                fetchSources(document.getElementById('filterInput').value.trim(), currentPage);
            } catch (error) {
                console.error('Error deleting source:', error);
                alert('Failed to delete source. Please try again.');
            }
        }

        // Initial load
        fetchSources();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
