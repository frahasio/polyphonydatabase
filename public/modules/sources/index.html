<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sources - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0">Sources</h1>
                <p class="text-muted">Manage musical sources</p>
            </div>
            <div>
                <a href="/" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-house"></i> Back to Home
                </a>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSourceModal">
                    <i class="bi bi-plus-lg"></i> Add Source
                </button>
            </div>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="input-group">
                    <input type="text" class="form-control" id="filterInput" placeholder="Search sources (minimum 2 characters)...">
                    <button class="btn btn-outline-secondary" type="button" id="clearFilter">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sources List -->
        <div class="card">
            <div class="card-body">
                <div class="list-group" id="sourcesList">
                    <div class="text-center text-muted">Loading sources...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Source Modal -->
    <div class="modal fade" id="addSourceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Source</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addSourceForm">
                        <div class="mb-3">
                            <label for="code" class="form-label">Code</label>
                            <input type="text" class="form-control" id="code" name="code" required>
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="fromYear" class="form-label">From Year</label>
                            <input type="number" class="form-control" id="fromYear" name="fromYear">
                        </div>
                        <div class="mb-3">
                            <label for="toYear" class="form-label">To Year</label>
                            <input type="number" class="form-control" id="toYear" name="toYear">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveSourceButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let searchTimeout;
        let currentPage = 1;
        const pageSize = 10;

        // Fetch and display sources
        async function fetchSources(searchTerm = '') {
            try {
                const response = await fetch(`/sources?page=${currentPage}&pageSize=${pageSize}&search=${searchTerm}`);
                const data = await response.json();
                
                if (data.sources && Array.isArray(data.sources)) {
                    displaySources(data.sources);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error fetching sources:', error);
                document.getElementById('sourcesList').innerHTML = `
                    <div class="text-center text-danger">
                        Failed to load sources. Please try again later.
                    </div>
                `;
            }
        }

        // Display sources in the list
        function displaySources(sources) {
            const list = document.getElementById('sourcesList');
            if (sources.length === 0) {
                list.innerHTML = `
                    <div class="text-center text-muted">No sources found</div>
                `;
                return;
            }

            list.innerHTML = sources.map(source => `
                <a href="edit.html?id=${source.id}" class="list-group-item list-group-item-action ${!source.catalogued ? 'list-group-item-warning' : ''}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="font-monospace fw-medium">${source.code}</span>
                                <span class="text-muted">${getYearDisplay(source)}</span>
                            </div>
                            <div class="text-muted small mt-1">${truncateText(source.title, 100)}</div>
                        </div>
                        ${!source.catalogued ? 
                            '<span class="badge bg-warning text-dark">Needs Cataloguing</span>' : 
                            ''}
                    </div>
                </a>
            `).join('');
        }

        // Helper function to get year display
        function getYearDisplay(source) {
            if (source.fromYear && source.toYear) {
                return `${source.fromYear}-${source.toYear}`;
            } else if (source.fromYear) {
                return source.fromYear.toString();
            } else if (source.toYear) {
                return source.toYear.toString();
            }
            return '';
        }

        // Helper function to truncate text
        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        // Handle search input
        document.getElementById('filterInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.trim();
            
            // Clear any existing timeout
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }

            // Only search if we have at least 2 characters
            if (searchTerm.length >= 2 || searchTerm.length === 0) {
                searchTimeout = setTimeout(() => {
                    currentPage = 1; // Reset to first page on new search
                    fetchSources(searchTerm);
                }, 300); // Debounce for 300ms
            }
        });

        // Clear filter
        document.getElementById('clearFilter').addEventListener('click', () => {
            document.getElementById('filterInput').value = '';
            currentPage = 1;
            fetchSources();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchSources();
        });
    </script>
</body>
</html>
