<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Performers</h1>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="new.html" target="_blank" class="btn btn-primary" title="Add a new performer (opens in new tab)">
                        <i class="bi bi-plus-lg"></i> Add Performer
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="performersList">
                            <!-- Performers will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchPerformers() {
            try {
                const response = await fetch('/api/admin/performers');
                if (!response.ok) {
                    throw new Error('Failed to fetch performers');
                }
                const data = await response.json();
                if (!data.performers) {
                    throw new Error('Invalid response format');
                }
                displayPerformers(data.performers);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load performers. Please try again.');
            }
        }

        function displayPerformers(performers) {
            const performersList = document.getElementById('performersList');
            
            performersList.innerHTML = performers.map(performer => `
                <tr>
                    <td>${performer.name || ''}</td>
                    <td>
                        <a href="edit.html?id=${performer.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this performer (opens in new tab)">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePerformer(${performer.id})" title="Delete this performer">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Delete performer
        async function deletePerformer(id) {
            if (!confirm('Are you sure you want to delete this performer?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/performers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete performer');
                }

                fetchPerformers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete performer. Please try again.');
            }
        }

        // Initialize
        fetchPerformers();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
