<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performers - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Performers</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPerformerModal">
                <i class="bi bi-plus-lg"></i> Add Performer
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="performersList">
                            <!-- Performers will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Performer Modal -->
    <div class="modal fade" id="addPerformerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Performer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPerformerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePerformerButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch all performers
        async function fetchPerformers() {
            try {
                const response = await fetch('/performers');
                if (!response.ok) {
                    throw new Error('Failed to fetch performers');
                }
                const performers = await response.json();
                
                const performersList = document.getElementById('performersList');
                performersList.innerHTML = performers.map(performer => `
                    <tr>
                        <td>${performer.name}</td>
                        <td>
                            <a href="edit.html?id=${performer.id}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deletePerformer(${performer.id})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load performers. Please try again.');
            }
        }

        // Add new performer
        document.getElementById('savePerformerButton').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const response = await fetch('/performers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    throw new Error('Failed to add performer');
                }

                // Close modal and refresh list
                const modal = bootstrap.Modal.getInstance(document.getElementById('addPerformerModal'));
                modal.hide();
                document.getElementById('addPerformerForm').reset();
                fetchPerformers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to add performer. Please try again.');
            }
        });

        // Delete performer
        async function deletePerformer(id) {
            if (!confirm('Are you sure you want to delete this performer?')) {
                return;
            }

            try {
                const response = await fetch(`/performers/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete performer');
                }

                fetchPerformers();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete performer. Please try again.');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchPerformers);
    </script>
</body>
</html>
