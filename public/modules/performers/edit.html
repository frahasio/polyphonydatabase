<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Performer - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edit Performer</h1>
            <a href="index.html" class="btn btn-outline-secondary">Back to List</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="performerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-danger" id="deleteButton">Delete Performer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let performerId = null;

        // Get performer ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        performerId = urlParams.get('id');

        if (!performerId) {
            window.location.href = 'index.html';
        }

        // Fetch performer data
        async function fetchPerformer() {
            try {
                const response = await fetch(`/performers/${performerId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch performer');
                }
                const performer = await response.json();
                
                // Populate form
                document.getElementById('name').value = performer.name || '';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load performer data. Please try again.');
            }
        }

        // Handle form submission
        document.getElementById('performerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value
            };

            try {
                const response = await fetch(`/performers/${performerId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update performer');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update performer. Please try again.');
            }
        });

        // Handle delete
        document.getElementById('deleteButton').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this performer?')) {
                return;
            }

            try {
                const response = await fetch(`/performers/${performerId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete performer');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete performer. Please try again.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchPerformer);
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
