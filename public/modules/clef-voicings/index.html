<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clef-Voicing Management - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .clef-combo-row {
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
        }
        .clef-combo-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }
        .save-status {
            display: none;
            margin-left: 10px;
            font-size: 0.875rem;
        }
        .save-status.success {
            color: #28a745;
        }
        .save-status.error {
            color: #dc3545;
        }
        .select2-container {
            width: 100% !important;
        }
        .select2-selection {
            min-height: 38px !important;
        }
        .pagination-info {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-music-note-list me-2"></i>Clef-Voicing Management</h2>
                </div>

                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    <strong>Note:</strong> This interface manages relationships between clef combinations and voicing types. 
                    Use the dropdown to assign multiple voicings to each clef combination.
                </div>

                <!-- Search and filter -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Search & Filter</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-8">
                                <input type="text" id="searchInput" class="form-control" placeholder="Search clef combinations or voicings..." onkeyup="filterCombinations()">
                            </div>
                            <div class="col-md-4">
                                <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add new voicing form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Add New Voicing</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <input type="text" id="newVoicing" class="form-control" placeholder="e.g., SSAATTBB" maxlength="50">
                            </div>
                            <div class="col-md-6">
                                <button type="button" class="btn btn-success" onclick="addVoicing()">Add Voicing</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading indicator -->
                <div id="loading" class="text-center py-4">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Loading clef combinations and voicings...</p>
                </div>

                <!-- Pagination and controls -->
                <div id="paginationControls" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="text-muted">Items per page:</span>
                            <select id="itemsPerPage" class="form-select form-select-sm d-inline-block w-auto ms-2" onchange="changeItemsPerPage()">
                                <option value="10">10</option>
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <nav id="pagination"></nav>
                    </div>
                </div>

                <!-- Clef combinations list -->
                <div id="clefCombinations" style="display: none;">
                    <!-- Populated by JavaScript -->
                </div>

                <!-- Bottom pagination -->
                <div id="bottomPagination" style="display: none;">
                    <nav id="bottomPaginationNav"></nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        let voicings = [];
        let clefCombinations = [];
        let filteredClefCombinations = [];
        let currentPage = 1;
        let itemsPerPage = 25;
        let totalPages = 1;
        let mappingsLookup = {};
        let currentSearchTerm = '';

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Get page and itemsPerPage from URL query parameters
            const urlParams = new URLSearchParams(window.location.search);
            currentPage = parseInt(urlParams.get('page')) || 1;
            itemsPerPage = parseInt(urlParams.get('itemsPerPage')) || 25;
            
            // Set the items per page dropdown
            document.getElementById('itemsPerPage').value = itemsPerPage;
            
            loadData();
        });

        async function loadData() {
            try {
                // Load voicings and clef combinations with session credentials
                const [voicingsResponse, clefCombosResponse, mappingsResponse] = await Promise.all([
                    fetch('/api/search/voicings', {
                        credentials: 'include'
                    }),
                    fetch('/api/admin/clef-combinations', {
                        credentials: 'include'
                    }),
                    fetch('/api/admin/clef-voicing-mappings', {
                        credentials: 'include'
                    })
                ]);

                if (!voicingsResponse.ok || !clefCombosResponse.ok || !mappingsResponse.ok) {
                    // Check if it's an authentication error
                    if (clefCombosResponse.status === 401 || clefCombosResponse.status === 403) {
                        window.location.href = '/admin/login';
                        return;
                    }
                    throw new Error('Failed to load data');
                }

                voicings = await voicingsResponse.json();
                clefCombinations = await clefCombosResponse.json();
                const mappings = await mappingsResponse.json();

                // Build mappings lookup (store globally for pagination)
                mappingsLookup = {};
                mappings.forEach(mapping => {
                    if (!mappingsLookup[mapping.clef_combination_id]) {
                        mappingsLookup[mapping.clef_combination_id] = [];
                    }
                    mappingsLookup[mapping.clef_combination_id].push(mapping.voicing_id);
                });

                // Sort clef combinations alphabetically
                clefCombinations.sort((a, b) => a.clef_combination.localeCompare(b.clef_combination));

                // Initialize filtered data and search
                applyCurrentFilter();

                renderClefCombinations();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('clefCombinations').style.display = 'block';
                document.getElementById('paginationControls').style.display = 'block';
                if (totalPages > 1) {
                    document.getElementById('bottomPagination').style.display = 'block';
                }

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <strong>Error:</strong> Failed to load clef-voicing data. Please ensure you are logged in as an admin and that the voicing system tables exist.
                        <br><br>
                        <a href="/admin/login" class="btn btn-primary">Go to Login</a>
                    </div>
                `;
            }
        }

        function renderClefCombinations() {
            const container = document.getElementById('clefCombinations');
            
            // Calculate pagination using filtered data
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredClefCombinations.slice(startIndex, endIndex);

            let html = `<h4 style="color: #333;">Clef Combinations Management (<span id="visibleCount">${filteredClefCombinations.length}</span> of ${clefCombinations.length} total)</h4>`;
            html += `<p class="text-muted mb-4">Page ${currentPage} of ${totalPages} - Showing ${pageItems.length} clef combinations</p>`;
            
            pageItems.forEach(combo => {
                const assignedVoicings = mappingsLookup[combo.id] || [];
                
                html += `
                    <div class="clef-combo-row" data-combo-id="${combo.id}">
                        <div class="row align-items-center">
                            <div class="col-md-3">
                                <div class="clef-combo-header">${combo.clef_combination}</div>
                            </div>
                            <div class="col-md-8">
                                <select class="form-select voicing-select" 
                                        id="voicings-${combo.id}" 
                                        multiple="multiple"
                                        data-combo-id="${combo.id}">
                                    ${voicings.map(voicing => 
                                        `<option value="${voicing.id}" ${assignedVoicings.includes(voicing.id) ? 'selected' : ''}>${voicing.name}</option>`
                                    ).join('')}
                                </select>
                            </div>
                            <div class="col-md-1">
                                <span class="save-status" id="status-${combo.id}"></span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;

            // Initialize Select2 for all voicing selects
            initializeSelect2Components();

            renderPagination();
        }

        function initializeSelect2Components() {
            // Destroy existing Select2 instances first (only if they exist)
            $('.voicing-select').each(function() {
                if ($(this).hasClass('select2-hidden-accessible')) {
                    $(this).select2('destroy');
                }
            });
            
            // Initialize Select2 for all voicing selects
            $('.voicing-select').select2({
                placeholder: 'Select voicings...',
                allowClear: true,
                width: '100%'
            }).on('change', function(e) {
                // Skip if this is a programmatic change from updateVoicingMappings
                if (e.isTrigger && e.namespace === 'select2') return;
                
                const comboId = $(this).data('combo-id');
                const selectedVoicings = $(this).val() || [];
                updateVoicingMappings(comboId, selectedVoicings);
            });
        }

        function renderPagination() {
            const paginationHTML = generatePaginationHTML();
            document.getElementById('pagination').innerHTML = paginationHTML;
            document.getElementById('bottomPaginationNav').innerHTML = paginationHTML;
        }

        function generatePaginationHTML() {
            if (totalPages <= 1) return '';

            let html = '<ul class="pagination pagination-sm mb-0">';
            
            // Previous button
            html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">‹ Previous</a>
            </li>`;

            // Page numbers (show max 5 pages around current)
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(1); return false;">1</a></li>`;
                if (startPage > 2) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>
                </li>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                html += `<li class="page-item"><a class="page-link" href="#" onclick="goToPage(${totalPages}); return false;">${totalPages}</a></li>`;
            }

            // Next button
            html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Next ›</a>
            </li>`;

            html += '</ul>';
            return html;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages || page === currentPage) return;
            currentPage = page;
            updateUrlParams();
            renderClefCombinations();
        }

        function changeItemsPerPage() {
            itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
            currentPage = 1; // Reset to first page
            totalPages = Math.ceil(filteredClefCombinations.length / itemsPerPage);
            updateUrlParams();
            renderClefCombinations();
        }

        function applyCurrentFilter() {
            const searchTerm = currentSearchTerm.toLowerCase().trim();
            
            if (searchTerm === '') {
                filteredClefCombinations = [...clefCombinations];
            } else {
                filteredClefCombinations = clefCombinations.filter(combo => {
                    // Check clef combination
                    if (combo.clef_combination.toLowerCase().includes(searchTerm)) {
                        return true;
                    }
                    
                    // Check assigned voicing names
                    const assignedVoicings = mappingsLookup[combo.id] || [];
                    const assignedVoicingNames = assignedVoicings.map(vId => {
                        const voicing = voicings.find(v => v.id === vId);
                        return voicing ? voicing.name.toLowerCase() : '';
                    }).join(' ');
                    
                    return assignedVoicingNames.includes(searchTerm);
                });
            }
            
            // Recalculate pagination
            totalPages = Math.ceil(filteredClefCombinations.length / itemsPerPage);
            
            // Reset to first page if current page is beyond available pages
            if (currentPage > totalPages && totalPages > 0) {
                currentPage = 1;
            }
        }

        function filterCombinations() {
            currentSearchTerm = document.getElementById('searchInput').value;
            currentPage = 1; // Reset to first page when searching
            applyCurrentFilter();
            renderClefCombinations();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchTerm = '';
            currentPage = 1;
            applyCurrentFilter();
            renderClefCombinations();
        }

        function updateUrlParams() {
            const url = new URL(window.location);
            url.searchParams.set('page', currentPage);
            url.searchParams.set('itemsPerPage', itemsPerPage);
            window.history.replaceState({}, '', url);
        }

        function updateMappingsLookup(clefComboId, voicingIds) {
            // Update the global mappings lookup when changes are made
            mappingsLookup[clefComboId] = voicingIds;
            
            // If there's an active search, refresh the filter since voicing assignments changed
            if (currentSearchTerm) {
                applyCurrentFilter();
                renderClefCombinations();
            }
        }

        async function updateVoicingMappings(clefComboId, selectedVoicingIds) {
            const statusElement = document.getElementById(`status-${clefComboId}`);
            const selectElement = $(`#voicings-${clefComboId}`);
            
            // Show saving status
            statusElement.textContent = 'Saving...';
            statusElement.className = 'save-status';
            statusElement.style.display = 'inline';
            
            try {
                // Get current mappings for this clef combination
                const response = await fetch('/api/admin/clef-voicing-mappings', {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch current mappings');
                }
                
                const allMappings = await response.json();
                const currentMappings = allMappings
                    .filter(m => m.clef_combination_id === clefComboId)
                    .map(m => m.voicing_id);

                // Find additions and removals
                const selectedIds = selectedVoicingIds.map(id => parseInt(id));
                const toAdd = selectedIds.filter(id => !currentMappings.includes(id));
                const toRemove = currentMappings.filter(id => !selectedIds.includes(id));

                // Add new mappings
                for (const voicingId of toAdd) {
                    const addResponse = await fetch('/api/admin/clef-voicing-mappings', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            clef_combination_id: clefComboId,
                            voicing_id: voicingId
                        })
                    });
                    
                    if (!addResponse.ok) {
                        const error = await addResponse.json();
                        throw new Error(error.error || 'Failed to add mapping');
                    }
                }

                // Remove old mappings
                for (const voicingId of toRemove) {
                    const removeResponse = await fetch('/api/admin/clef-voicing-mappings', {
                        method: 'DELETE',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            clef_combination_id: clefComboId,
                            voicing_id: voicingId
                        })
                    });
                    
                    if (!removeResponse.ok) {
                        const error = await removeResponse.json();
                        throw new Error(error.error || 'Failed to remove mapping');
                    }
                }

                // Refresh the current mappings from server to verify success
                const verifyResponse = await fetch('/api/admin/clef-voicing-mappings', {
                    credentials: 'include'
                });
                
                if (verifyResponse.ok) {
                    const updatedMappings = await verifyResponse.json();
                    const updatedCurrentMappings = updatedMappings
                        .filter(m => m.clef_combination_id === clefComboId)
                        .map(m => m.voicing_id);
                    
                    // Update the select element with the server state (prevent triggering change event)
                    selectElement.off('change').val(updatedCurrentMappings).select2().on('change', function(e) {
                        // Skip if this is a programmatic change from updateVoicingMappings
                        if (e.isTrigger && e.namespace === 'select2') return;
                        
                        const comboId = $(this).data('combo-id');
                        const selectedVoicings = $(this).val() || [];
                        updateVoicingMappings(comboId, selectedVoicings);
                    });

                    // Update global mappings lookup
                    updateMappingsLookup(clefComboId, updatedCurrentMappings);
                }

                // Show success status
                statusElement.textContent = 'Saved';
                statusElement.className = 'save-status success';
                statusElement.style.display = 'inline';
                
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 2000);

            } catch (error) {
                console.error('Error updating mappings:', error);
                
                // Revert the select to previous state by refreshing from server
                try {
                    const revertResponse = await fetch('/api/admin/clef-voicing-mappings', {
                        credentials: 'include'
                    });
                    if (revertResponse.ok) {
                        const allMappings = await revertResponse.json();
                        const currentMappings = allMappings
                            .filter(m => m.clef_combination_id === clefComboId)
                            .map(m => m.voicing_id);
                        selectElement.off('change').val(currentMappings).select2().on('change', function(e) {
                            // Skip if this is a programmatic change from updateVoicingMappings
                            if (e.isTrigger && e.namespace === 'select2') return;
                            
                            const comboId = $(this).data('combo-id');
                            const selectedVoicings = $(this).val() || [];
                            updateVoicingMappings(comboId, selectedVoicings);
                        });

                        // Update global mappings lookup  
                        updateMappingsLookup(clefComboId, currentMappings);
                    }
                } catch (revertError) {
                    console.error('Error reverting select state:', revertError);
                }
                
                statusElement.textContent = 'Error: ' + error.message;
                statusElement.className = 'save-status error';
                statusElement.style.display = 'inline';
                
                setTimeout(() => {
                    statusElement.style.display = 'none';
                }, 4000);
            }
        }

        async function addVoicing() {
            const input = document.getElementById('newVoicing');
            const voicingName = input.value.trim();
            
            if (!voicingName) {
                alert('Please enter a voicing name');
                return;
            }

            try {
                const response = await fetch('/api/admin/voicings', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ voicing: voicingName })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add voicing');
                }

                input.value = '';
                loadData(); // Reload the page data
                
            } catch (error) {
                console.error('Error adding voicing:', error);
                alert('Error adding voicing: ' + error.message);
            }
        }

        // Allow Enter key to add voicing
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('newVoicing').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addVoicing();
                }
            });
        });

        async function logout() {
            try {
                await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                window.location.href = '/admin/login';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/admin/login';
            }
        }
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
