<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scribe - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edit Scribe</h1>
            <a href="index.html" class="btn btn-outline-secondary">Back to List</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form id="scribeForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-danger" id="deleteButton">Delete Scribe</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let scribeId = null;

        // Get scribe ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        scribeId = urlParams.get('id');

        if (!scribeId) {
            window.location.href = 'index.html';
        }

        // Fetch scribe data
        async function fetchScribe() {
            try {
                const response = await fetch(`/scribes/${scribeId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch scribe');
                }
                const scribe = await response.json();
                
                // Populate form
                document.getElementById('name').value = scribe.name || '';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load scribe data. Please try again.');
            }
        }

        // Handle form submission
        document.getElementById('scribeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value
            };

            try {
                const response = await fetch(`/scribes/${scribeId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update scribe');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to update scribe. Please try again.');
            }
        });

        // Handle delete
        document.getElementById('deleteButton').addEventListener('click', async () => {
            if (!confirm('Are you sure you want to delete this scribe?')) {
                return;
            }

            try {
                const response = await fetch(`/scribes/${scribeId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete scribe');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete scribe. Please try again.');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchScribe);
    </script>
</body>
</html>
