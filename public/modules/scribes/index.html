<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribes - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Scribes</h1>
            <a href="/admin" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addScribeModal">
                        <i class="bi bi-plus-lg"></i> Add Scribe
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="scribesList">
                            <!-- Scribes will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Scribe Modal -->
    <div class="modal fade" id="addScribeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Scribe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addScribeForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveScribeButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display scribes
        async function fetchScribes() {
            try {
                const response = await fetch('/api/admin/scribes');
                if (!response.ok) {
                    throw new Error('Failed to fetch scribes');
                }
                const data = await response.json();
                if (!data.scribes) {
                    throw new Error('Invalid response format');
                }
                displayScribes(data.scribes);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load scribes. Please try again.');
            }
        }

        function displayScribes(scribes) {
            const scribesList = document.getElementById('scribesList');
            
            scribesList.innerHTML = scribes.map(scribe => `
                <tr>
                    <td>${scribe.name || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editScribe(${scribe.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteScribe(${scribe.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        const form = document.getElementById('addScribeForm');
        const submitBtn = document.getElementById('saveScribeButton');
        const modal = document.getElementById('addScribeModal');
        let editingId = null;

        submitBtn.addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const url = editingId ? `/api/admin/scribes/${editingId}` : '/api/admin/scribes';
                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });

                if (!response.ok) {
                    throw new Error(`Failed to ${editingId ? 'update' : 'create'} scribe`);
                }

                // Close modal and refresh list
                const modalInstance = bootstrap.Modal.getInstance(modal);
                modalInstance.hide();
                form.reset();
                resetFormState();
                fetchScribes();
            } catch (error) {
                console.error(`Error ${editingId ? 'updating' : 'creating'} scribe:`, error);
                alert(`Failed to ${editingId ? 'update' : 'create'} scribe. Please try again.`);
            }
        });

        function resetFormState() {
            editingId = null;
            modal.querySelector('.modal-title').textContent = 'Add New Scribe';
            submitBtn.textContent = 'Save';
        }

        // Handle edit
        async function editScribe(id) {
            try {
                const response = await fetch(`/api/admin/scribes/${id}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch scribe details');
                }
                const data = await response.json();
                const scribe = data.scribe;

                // Set editing state
                editingId = id;
                modal.querySelector('.modal-title').textContent = 'Edit Scribe';
                submitBtn.textContent = 'Save Changes';

                // Populate the form with scribe data
                document.getElementById('name').value = scribe.name || '';

                // Show the modal
                const modalInstance = new bootstrap.Modal(modal);
                modalInstance.show();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load scribe details. Please try again.');
            }
        }

        // Reset form state when modal is hidden
        modal.addEventListener('hidden.bs.modal', resetFormState);

        // Delete scribe
        async function deleteScribe(id) {
            if (!confirm('Are you sure you want to delete this scribe?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/scribes/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete scribe');
                }

                fetchScribes();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete scribe. Please try again.');
            }
        }

        // Initialize
        fetchScribes();
    </script>
</body>
</html>
