<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scribes - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Scribes</h1>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="new.html" target="_blank" class="btn btn-primary" title="Add a new scribe (opens in new tab)">
                        <i class="bi bi-plus-lg"></i> Add Scribe
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="scribesList">
                            <!-- Scribes will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch and display scribes
        async function fetchScribes() {
            try {
                const response = await fetch('/api/admin/scribes');
                if (!response.ok) {
                    throw new Error('Failed to fetch scribes');
                }
                const data = await response.json();
                if (!data.scribes) {
                    throw new Error('Invalid response format');
                }
                displayScribes(data.scribes);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load scribes. Please try again.');
            }
        }

        function displayScribes(scribes) {
            const scribesList = document.getElementById('scribesList');
            
            scribesList.innerHTML = scribes.map(scribe => `
                <tr>
                    <td>${scribe.name || ''}</td>
                    <td>
                        <a href="edit.html?id=${scribe.id}" target="_blank" class="btn btn-sm btn-outline-primary me-2" title="Edit this scribe (opens in new tab)">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteScribe(${scribe.id})" title="Delete this scribe">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Delete scribe
        async function deleteScribe(id) {
            if (!confirm('Are you sure you want to delete this scribe?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/scribes/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete scribe');
                }

                fetchScribes();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to delete scribe. Please try again.');
            }
        }

        // Initialize
        fetchScribes();
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
