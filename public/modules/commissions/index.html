<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commissions - Polyphony Database</title>
    <script src="/js/dom-utils.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .commission-card.status-enquiry { border-left: 4px solid #0d6efd; }
        .commission-card.status-offered { border-left: 4px solid #fd7e14; }
        .commission-card.status-paid { border-left: 4px solid #198754; }
        .commission-card.status-declined, .commission-card.status-cancelled { border-left: 4px solid #adb5bd; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h1 class="mb-0">Commissions</h1>
            <div class="btn-group btn-group-sm" id="statusFilter">
                <button type="button" class="btn btn-outline-secondary active" data-status="">All</button>
                <button type="button" class="btn btn-outline-secondary" data-status="enquiry">Enquiries</button>
                <button type="button" class="btn btn-outline-secondary" data-status="offered">Offered</button>
                <button type="button" class="btn btn-outline-secondary" data-status="paid">Paid</button>
            </div>
        </div>

        <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        <div id="list" style="display:none"></div>
        <div id="emptyState" class="text-center text-muted py-5" style="display:none">
            <i class="bi bi-inbox" style="font-size:2rem"></i>
            <p class="mt-2">No commissions in this view yet.</p>
        </div>
    </div>

    <!-- Offer modal -->
    <div class="modal fade" id="offerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set a price</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3" id="offerPiece"></p>
                    <div class="mb-3">
                        <label class="form-label">Price (GBP)</label>
                        <div class="input-group">
                            <span class="input-group-text">£</span>
                            <input type="number" class="form-control" id="offerPrice" min="1" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Note to commissioner <span class="text-muted">(optional)</span></label>
                        <textarea class="form-control" id="offerNote" rows="3" maxlength="4000"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="offerSendBtn">Send offer email</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStatus = '';
        let offerModal = null;
        let offerId = null;

        function fmtPrice(pence, currency) {
            if (!pence) return '';
            return (pence / 100).toLocaleString('en-GB', { style: 'currency', currency: currency || 'GBP' });
        }
        function fmtDate(s) { return s ? new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }

        async function load() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('list').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            try {
                const params = new URLSearchParams();
                if (currentStatus) params.set('status', currentStatus);
                const res = await fetch('/api/admin/commissions?' + params.toString(), { credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load commissions (' + res.status + ')');
                const data = await res.json();
                render(data.commissions || []);
            } catch (e) {
                document.getElementById('list').style.display = 'block';
                document.getElementById('list').innerHTML = '<div class="alert alert-danger">' + escapeHtml(e.message) + '</div>';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function render(items) {
            const list = document.getElementById('list');
            if (!items.length) {
                document.getElementById('emptyState').style.display = 'block';
                list.style.display = 'none';
                return;
            }
            list.style.display = 'block';
            list.innerHTML = items.map(c => {
                const price = fmtPrice(c.price_pence, c.currency);
                const canOffer = c.status === 'enquiry' || c.status === 'offered';
                const canCancel = c.status !== 'paid' && c.status !== 'cancelled';
                return `
                <div class="card commission-card status-${escapeHtml(c.status)} mb-3">
                    <div class="card-body py-3">
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                            <div class="flex-grow-1">
                                <div class="fw-semibold">${escapeHtml(c.piece_description)}</div>
                                <div class="text-muted small">
                                    ${escapeHtml(c.commissioner_name)} &lt;${escapeHtml(c.commissioner_email)}&gt; · ${fmtDate(c.created_at)}
                                    ${c.group_title ? ' · linked: ' + escapeHtml(c.group_title) : ''}
                                </div>
                                ${c.requirements ? `<div class="small mt-1"><strong>Requirements:</strong> ${escapeHtml(c.requirements)}</div>` : ''}
                                ${c.admin_note ? `<div class="small mt-1 text-muted"><strong>Your note:</strong> ${escapeHtml(c.admin_note)}</div>` : ''}
                            </div>
                            <div class="text-end">
                                <span class="badge bg-light text-dark mb-2">${escapeHtml(c.status)}${price ? ' · ' + escapeHtml(price) : ''}</span>
                                <div class="btn-group btn-group-sm d-block">
                                    ${canOffer ? `<button class="btn btn-primary" onclick="openOffer(${c.id}, ${JSON.stringify(c.piece_description).replace(/"/g, '&quot;')}, ${c.price_pence || 0})">${c.status === 'offered' ? 'Revise price' : 'Set price'}</button>` : ''}
                                    ${canCancel ? `<button class="btn btn-outline-danger" onclick="cancelCommission(${c.id})">Cancel</button>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function openOffer(id, piece, pricePence) {
            offerId = id;
            document.getElementById('offerPiece').textContent = piece;
            document.getElementById('offerPrice').value = pricePence ? (pricePence / 100).toFixed(2) : '';
            document.getElementById('offerNote').value = '';
            offerModal.show();
        }

        document.getElementById('offerSendBtn').addEventListener('click', async () => {
            const pounds = parseFloat(document.getElementById('offerPrice').value);
            if (!(pounds > 0)) { alert('Enter a valid price.'); return; }
            const btn = document.getElementById('offerSendBtn');
            btn.disabled = true;
            try {
                const res = await fetch(`/api/admin/commissions/${offerId}/offer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ price_pence: Math.round(pounds * 100), admin_note: document.getElementById('offerNote').value })
                });
                const data = await res.json();
                if (res.ok) { offerModal.hide(); load(); }
                else alert(data.error || 'Failed to send offer.');
            } catch (e) {
                alert('Network error.');
            } finally {
                btn.disabled = false;
            }
        });

        async function cancelCommission(id) {
            if (!confirm('Cancel this commission?')) return;
            try {
                const res = await fetch(`/api/admin/commissions/${id}/cancel`, { method: 'POST', credentials: 'include' });
                if (res.ok) load(); else alert('Could not cancel.');
            } catch (e) { alert('Network error.'); }
        }

        document.querySelectorAll('#statusFilter button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#statusFilter button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStatus = btn.dataset.status;
                load();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            offerModal = new bootstrap.Modal(document.getElementById('offerModal'));
            load();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
