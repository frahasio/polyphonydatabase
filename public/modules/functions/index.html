<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .composition-count {
            font-size: 0.875rem;
            color: #6c757d;
        }
        .function-badge {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">Functions Management</h4>
                <p class="text-muted mb-0">Create, edit and manage liturgical functions</p>
            </div>
            <button class="btn btn-primary" onclick="showAddFunctionModal()">
                <i class="bi bi-plus"></i> Add New Function
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="functionsResults">
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-tag display-4 text-muted"></i>
                        <p>Loading functions...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Function Modal -->
    <div class="modal fade" id="addFunctionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Function</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="newFunctionName" class="form-label">Function Name</label>
                        <input type="text" class="form-control" id="newFunctionName" placeholder="Enter function name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createFunction()">Add Function</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Function Modal -->
    <div class="modal fade" id="editFunctionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Function</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editFunctionName" class="form-label">Function Name</label>
                        <input type="text" class="form-control" id="editFunctionName">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveFunctionEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="functions.js"></script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
