<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Polyphony Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .info-text {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #fcc;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #cfc;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <h1>Polyphony Database</h1>
            <p>Password Reset</p>
        </div>

        <div class="info-text">
            Enter your email address and we'll send you instructions to reset your password.
        </div>

        <div id="message"></div>

        <form id="resetForm" style="display: block;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>

            <button type="submit" class="btn" id="resetBtn">
                Send Reset Instructions
            </button>

            <button type="button" class="btn btn-secondary" onclick="window.location.href='/login.html'">
                Back to Login
            </button>
        </form>

        <div class="loading" id="loading">
            Sending reset instructions...
        </div>

        <div id="successMessage" style="display: none;">
            <div class="success">
                <strong>Instructions Sent!</strong><br>
                If an account with that email address exists, you will receive password reset instructions shortly.
            </div>
            <div class="links">
                <a href="/login.html">Return to Login</a>
            </div>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');
        const successMessage = document.getElementById('successMessage');

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(resetForm);
            const email = formData.get('email').trim();

            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            try {
                setLoading(true);
                clearMessage();

                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                // Always show success to prevent email enumeration
                resetForm.style.display = 'none';
                successMessage.style.display = 'block';

                // Log the actual response for debugging (remove in production)
                if (!response.ok) {
                    console.warn('Password reset request failed:', data.error);
                }

            } catch (error) {
                console.error('Password reset error:', error);
                showMessage('Network error. Please try again.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            resetBtn.disabled = isLoading;
            loading.style.display = isLoading ? 'block' : 'none';
            resetForm.style.display = isLoading ? 'none' : 'block';
        }

        function showMessage(message, type) {
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
        }

        function clearMessage() {
            messageDiv.innerHTML = '';
        }
    </script>
</body>
</html>
