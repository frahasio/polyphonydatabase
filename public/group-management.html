<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups, Editions & Recordings - Polyphony Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .result-row { cursor: pointer; }
        .result-row:hover { background: #f6f8fa; }
        /* Custom class (NOT Bootstrap's .active, which forces white text) */
        .result-row.open-group { background: #eef4ff; border-left: 3px solid #0d6efd; }
        .result-row .form-check-input { cursor: pointer; }
        .chip { display: inline-block; background: #eef; border-radius: 3px; padding: 0 0.4rem; margin-right: 0.25rem; font-size: 0.78rem; white-space: nowrap; }
        .chip.warn { background: #fff3cd; }
        .chip.zero { background: #f1f3f5; color: #999; }
        .src-badge { font-size: 0.72rem; background: #f1f3f5; border-radius: 3px; padding: 0 0.3rem; margin-right: 0.2rem; white-space: nowrap; }
        #resultsList { max-height: calc(100vh - 300px); overflow-y: auto; }
        #workbench { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
        .wb-section { border-top: 1px solid #e9ecef; padding-top: 0.75rem; margin-top: 1rem; }
        .wb-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px dotted #eee; }
        .wb-row:last-child { border-bottom: none; }
        #selectionBar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1040; background: #212529; color: #fff;
                        padding: 0.6rem 1rem; display: none; box-shadow: 0 -3px 12px rgba(0,0,0,0.25); }
        #selectionBar .form-control, #selectionBar .form-select { max-width: 320px; display: inline-block; }
        body.has-selection { padding-bottom: 130px; }
        .toast-area { position: fixed; top: 1rem; right: 1rem; z-index: 2000; }
        .move-panel { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 0.75rem; }
        .move-target { cursor: pointer; padding: 0.25rem 0.5rem; border-radius: 4px; }
        .move-target:hover { background: #eef4ff; }
        .move-target.chosen { background: #cfe2ff; }
        .inline-add { background: #f8f9fa; border-radius: 6px; padding: 0.5rem; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h4 class="fw-bold mb-0">Groups, editions &amp; recordings</h4>
            <span class="text-muted small">Click a group to work on it &middot; tick boxes to merge or bulk-edit</span>
        </div>

        <div class="row g-3">
            <!-- ===== Left: search + results ===== -->
            <div class="col-lg-5">
                <div class="card mb-2">
                    <div class="card-body py-3">
                        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Search by title (group or composition)&hellip;">
                        <div class="row g-2">
                            <div class="col-4"><select id="voicesFilter" class="form-select form-select-sm"><option value="">Any voices</option></select></div>
                            <div class="col-8"><select id="composerFilter" class="form-select form-select-sm"><option value="">Any composer</option></select></div>
                            <div class="col-4"><select id="typeFilter" class="form-select form-select-sm"><option value="">Any type</option></select></div>
                            <div class="col-4"><select id="toneFilter" class="form-select form-select-sm"><option value="">Any tone</option></select></div>
                            <div class="col-4"><select id="evenOddFilter" class="form-select form-select-sm"><option value="">Any even/odd</option></select></div>
                            <div class="col-12 d-flex gap-3">
                                <div class="form-check form-check-sm">
                                    <input class="form-check-input" type="checkbox" id="hasEditionsFilter">
                                    <label class="form-check-label small" for="hasEditionsFilter">Has editions</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="hasRecordingsFilter">
                                    <label class="form-check-label small" for="hasRecordingsFilter">Has recordings</label>
                                </div>
                                <span class="ms-auto text-muted small" id="resultCount"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="resultsList" class="list-group">
                    <div class="text-center text-muted py-5" id="emptyHint">
                        <i class="bi bi-search display-6"></i>
                        <p class="mt-2 mb-0">Search or set a filter to list groups</p>
                    </div>
                </div>
            </div>

            <!-- ===== Right: workbench ===== -->
            <div class="col-lg-7">
                <div id="workbench" class="card">
                    <div class="card-body" id="workbenchBody">
                        <div class="text-center text-muted py-5">
                            <i class="bi bi-collection display-6"></i>
                            <p class="mt-2 mb-0">Select a group on the left to see and edit its inclusions, editions and recordings</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Bottom selection bar (merge / bulk edit) ===== -->
    <div id="selectionBar">
        <div class="d-flex align-items-center flex-wrap gap-2">
            <strong><span id="selCount">0</span> groups selected</strong>
            <span id="compatBadge" class="badge bg-secondary"></span>
            <input type="text" id="mergeTitle" class="form-control form-control-sm" placeholder="Display title for merged group">
            <button class="btn btn-success btn-sm" id="mergeBtn" onclick="doMerge()"><i class="bi bi-union"></i> Merge groups</button>
            <button class="btn btn-outline-light btn-sm" onclick="toggleBulkEdit()"><i class="bi bi-pencil-square"></i> Bulk edit&hellip;</button>
            <button class="btn btn-outline-light btn-sm ms-auto" onclick="clearSelection()">Clear selection</button>
        </div>
        <div id="bulkEditPanel" class="mt-2 pt-2 border-top border-secondary" style="display:none">
            <div class="d-flex align-items-center flex-wrap gap-2">
                <input type="text" id="bulkTitle" class="form-control form-control-sm" placeholder="New display title for all selected">
                <button class="btn btn-warning btn-sm" onclick="doBulkTitles()">Apply title</button>
                <span class="mx-2 text-secondary">|</span>
                <select id="bulkType" class="form-select form-select-sm" style="max-width:170px"><option value="">Type: keep</option><option value="__null">Type: remove</option></select>
                <select id="bulkTone" class="form-select form-select-sm" style="max-width:170px"><option value="">Tone: keep</option><option value="__null">Tone: remove</option></select>
                <select id="bulkEvenOdd" class="form-select form-select-sm" style="max-width:180px"><option value="">Even/odd: keep</option><option value="__null">Even/odd: remove</option></select>
                <button class="btn btn-info btn-sm" onclick="doBulkProps()">Apply properties</button>
            </div>
        </div>
    </div>

    <div class="toast-area" id="toastArea"></div>

    <script src="/js/dom-utils.js"></script>
    <script>
        // ================= state =================
        let page = 1, hasMore = false, loading = false;
        let results = [];                    // current search rows
        const selected = new Map();          // groupId -> row
        let openGroupId = null;
        let openGroupData = null;
        let searchTimer = null;
        let moveState = null;                // { targetId, targetTitle } while move panel open

        const toneNames = { '1':'primi toni','2':'secundi toni','3':'tertii toni','4':'quarti toni','5':'quinti toni','6':'sexti toni','7':'septimi toni','8':'octavi toni','9':'noni toni','10':'decimi toni','11':'undecimi toni','12':'duodecimi toni','mix':'mixti toni','per':'peregrini toni','pro':'proprii toni' };
        const evenOddNames = { 0:'pares', 1:'impares', 2:'pares et impares' };

        function toast(message, ok = true) {
            const el = document.createElement('div');
            el.className = `alert ${ok ? 'alert-success' : 'alert-danger'} shadow-sm py-2 px-3 mb-2`;
            el.textContent = message;
            document.getElementById('toastArea').appendChild(el);
            setTimeout(() => el.remove(), ok ? 3500 : 7000);
        }

        async function api(path, options = {}) {
            const res = await fetch(path, { credentials: 'include', ...options });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
            return data;
        }

        // ================= filters =================
        async function loadFilterOptions() {
            const fill = (id, items, valueKey, nameKey) => {
                const sel = document.getElementById(id);
                items.forEach(i => {
                    const o = document.createElement('option');
                    o.value = i[valueKey]; o.textContent = i[nameKey];
                    sel.appendChild(o);
                });
            };
            try {
                const [voices, composers, types, tones, evenOdd] = await Promise.all([
                    api('/api/search/voices'), api('/api/search/composers'),
                    api('/api/search/composition-types'), api('/api/search/tones'), api('/api/search/even-odd'),
                ]);
                fill('voicesFilter', voices.map(v => ({ value: v.value, name: v.name + 'vv' })), 'value', 'name');
                fill('composerFilter', composers, 'id', 'name');
                fill('typeFilter', types, 'id', 'name');
                fill('toneFilter', tones, 'value', 'name');
                fill('evenOddFilter', evenOdd.map(e => ({ value: e.value, name: evenOddNames[e.value] || e.name })), 'value', 'name');
                // Bulk-edit selects reuse the same option data
                fill('bulkType', types, 'id', 'name');
                fill('bulkTone', tones, 'value', 'name');
                fill('bulkEvenOdd', evenOdd.map(e => ({ value: e.value, name: evenOddNames[e.value] || e.name })), 'value', 'name');
            } catch (e) { toast('Could not load filter options: ' + e.message, false); }
        }

        function currentFilters() {
            return {
                title: document.getElementById('searchInput').value.trim(),
                voices: document.getElementById('voicesFilter').value,
                composer: document.getElementById('composerFilter').value,
                type: document.getElementById('typeFilter').value,
                tone: document.getElementById('toneFilter').value,
                even_odd: document.getElementById('evenOddFilter').value,
                has_editions: document.getElementById('hasEditionsFilter').checked ? 'true' : '',
                has_recordings: document.getElementById('hasRecordingsFilter').checked ? 'true' : '',
            };
        }

        // ================= search / list =================
        async function search(reset = true) {
            const f = currentFilters();
            const anyCriterion = Object.values(f).some(v => v);
            const list = document.getElementById('resultsList');
            if (!anyCriterion) {
                results = []; page = 1; hasMore = false;
                document.getElementById('resultCount').textContent = '';
                list.innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-search display-6"></i><p class="mt-2 mb-0">Search or set a filter to list groups</p></div>`;
                return;
            }
            if (reset) { page = 1; results = []; }
            if (loading) return;
            loading = true;
            try {
                const params = new URLSearchParams({ page, page_size: 25, sort: 'title' });
                Object.entries(f).forEach(([k, v]) => { if (v) params.set(k, v); });
                const data = await api('/api/admin/groups?' + params.toString());
                results = reset ? data.groups : results.concat(data.groups);
                hasMore = data.page < data.total_pages;
                document.getElementById('resultCount').textContent = `${data.total} group${data.total === 1 ? '' : 's'}`;
                renderResults();
            } catch (e) {
                list.innerHTML = `<div class="alert alert-danger">${escapeHtml(e.message)}</div>`;
            } finally { loading = false; }
        }

        function attrChips(g) {
            const chips = [];
            const warn = (arr) => Array.isArray(arr) && arr.length > 1;
            if (g.voices_list && g.voices_list.length) {
                chips.push(`<span class="chip${warn(g.voices_list) ? ' warn' : ''}">${g.voices_list.map(escapeHtml).join('/')}vv</span>`);
            }
            if (g.types_list && g.types_list.length) {
                chips.push(`<span class="chip${warn(g.types_list) ? ' warn' : ''}">${g.types_list.map(escapeHtml).join(' / ')}</span>`);
            }
            (g.tones_list || []).forEach(t => {
                // tones_list values are text[] literals like {1} or {1,2}
                const vals = String(t).replace(/[{}"]/g, '').split(',').filter(Boolean);
                if (vals.length) chips.push(`<span class="chip">${vals.map(v => escapeHtml(toneNames[v] || v)).join(' & ')}</span>`);
            });
            (g.even_odd_list || []).forEach(v => {
                if (evenOddNames[v] !== undefined) chips.push(`<span class="chip">${evenOddNames[v]}</span>`);
            });
            return chips.join('');
        }

        function countChips(g) {
            const c = (n, label) => `<span class="chip${n > 0 ? '' : ' zero'}">${n} ${label}${n === 1 ? '' : 's'}</span>`;
            return c(parseInt(g.composition_count), 'inclusion') + c(parseInt(g.edition_count), 'edition') + c(parseInt(g.recording_count), 'recording');
        }

        function renderResults() {
            const list = document.getElementById('resultsList');
            if (!results.length) {
                list.innerHTML = `<div class="text-center text-muted py-4">No groups match.</div>`;
                return;
            }
            list.innerHTML = results.map(g => `
                <div class="list-group-item result-row d-flex gap-2 align-items-start ${g.id === openGroupId ? 'open-group' : ''}" id="row-${g.id}" onclick="openGroup(${g.id})">
                    <input class="form-check-input mt-1" type="checkbox" ${selected.has(g.id) ? 'checked' : ''}
                           onclick="event.stopPropagation(); toggleSelect(${g.id}, this.checked)" title="Select for merge / bulk edit">
                    <div class="flex-grow-1">
                        <div class="fw-semibold">${escapeHtml(g.display_title)}</div>
                        <div class="text-muted small">${g.composers ? escapeHtml(g.composers) : 'Anon'}</div>
                        <div class="mt-1">${attrChips(g)}</div>
                        <div class="mt-1">${countChips(g)}</div>
                    </div>
                </div>
            `).join('') + (hasMore ? `<div class="list-group-item text-center text-muted small py-2" id="loadingMore">Scroll for more&hellip;</div>` : '');
        }

        document.getElementById('resultsList').addEventListener('scroll', function () {
            if (hasMore && !loading && this.scrollTop + this.clientHeight >= this.scrollHeight - 120) {
                page += 1;
                search(false);
            }
        });

        // ================= selection / merge / bulk =================
        function toggleSelect(id, on) {
            const row = results.find(r => r.id === id);
            if (on && row) selected.set(id, row);
            else selected.delete(id);
            renderSelectionBar();
        }

        function clearSelection() {
            selected.clear();
            renderSelectionBar();
            renderResults();
        }

        function selectionCompatibility() {
            const rows = [...selected.values()];
            const union = (key) => new Set(rows.flatMap(r => (r[key] || []).map(String)));
            const problems = [];
            if (union('voices_list').size > 1) problems.push('voice counts');
            if (union('types_list').size > 1) problems.push('types');
            if (union('tones_list').size > 1) problems.push('tones');
            if (union('even_odd_list').size > 1) problems.push('even/odd');
            return problems;
        }

        function renderSelectionBar() {
            const bar = document.getElementById('selectionBar');
            const n = selected.size;
            document.body.classList.toggle('has-selection', n > 0);
            bar.style.display = n > 0 ? 'block' : 'none';
            if (!n) return;
            document.getElementById('selCount').textContent = n;
            const badge = document.getElementById('compatBadge');
            const mergeBtn = document.getElementById('mergeBtn');
            const titleInput = document.getElementById('mergeTitle');
            if (n < 2) {
                badge.className = 'badge bg-secondary';
                badge.textContent = 'select another group to merge';
                mergeBtn.disabled = true;
            } else {
                const problems = selectionCompatibility();
                if (problems.length) {
                    badge.className = 'badge bg-danger';
                    badge.textContent = 'cannot merge: different ' + problems.join(', ');
                    mergeBtn.disabled = true;
                } else {
                    badge.className = 'badge bg-success';
                    badge.textContent = 'compatible';
                    mergeBtn.disabled = false;
                }
            }
            if (!titleInput.value) titleInput.value = [...selected.values()][0].display_title;
        }

        async function doMerge() {
            const title = document.getElementById('mergeTitle').value.trim();
            if (!title) return toast('Enter a display title for the merged group', false);
            try {
                const data = await api('/api/admin/groups/merge', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ groupIds: [...selected.keys()], displayTitle: title }),
                });
                toast(data.message);
                document.getElementById('mergeTitle').value = '';
                clearSelection();
                await search(true);
                openGroup(data.newGroupId);
            } catch (e) { toast(e.message, false); }
        }

        function toggleBulkEdit() {
            const p = document.getElementById('bulkEditPanel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        async function doBulkTitles() {
            const title = document.getElementById('bulkTitle').value.trim();
            if (!title) return toast('Enter the new display title', false);
            try {
                const data = await api('/api/admin/groups/bulk-update-titles', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ groupIds: [...selected.keys()], displayTitle: title }),
                });
                toast(data.message);
                clearSelection();
                search(true);
            } catch (e) { toast(e.message, false); }
        }

        async function doBulkProps() {
            const val = (id) => {
                const v = document.getElementById(id).value;
                if (v === '') return undefined;        // keep
                if (v === '__null') return null;       // remove
                return v;
            };
            const body = { groupIds: [...selected.keys()] };
            const t = val('bulkType'); if (t !== undefined) body.compositionTypeId = t;
            const tn = val('bulkTone'); if (tn !== undefined) body.tone = tn;
            const eo = val('bulkEvenOdd'); if (eo !== undefined) body.evenOdd = eo;
            if (body.compositionTypeId === undefined && body.tone === undefined && body.evenOdd === undefined) {
                return toast('Choose at least one property to change', false);
            }
            try {
                const data = await api('/api/admin/groups/bulk-update-compositions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                toast(data.message.split('\n')[0]);
                clearSelection();
                search(true);
                if (openGroupId) openGroup(openGroupId);
            } catch (e) { toast(e.message, false); }
        }

        // ================= workbench =================
        async function openGroup(id) {
            moveState = null;
            try {
                openGroupData = await api('/api/admin/groups/' + id);
                openGroupId = id;
                renderResults(); // update active highlight
                renderWorkbench();
            } catch (e) { toast(e.message, false); }
        }

        function compAttr(c) {
            const bits = [];
            if (c.number_of_voices) bits.push(`<span class="chip">${escapeHtml(c.number_of_voices)}vv</span>`);
            if (c.composition_type) bits.push(`<span class="chip">${escapeHtml(c.composition_type)}</span>`);
            const tones = Array.isArray(c.tone) ? c.tone.filter(Boolean) : (c.tone ? [c.tone] : []);
            if (tones.length) {
                const conj = c.tone_connector === 'vel' ? ' vel ' : ' & ';
                bits.push(`<span class="chip">${tones.map(t => escapeHtml(toneNames[t] || t)).join(conj)}</span>`);
            }
            if (c.even_odd !== null && c.even_odd !== undefined && evenOddNames[c.even_odd]) bits.push(`<span class="chip">${evenOddNames[c.even_odd]}</span>`);
            return bits.join('');
        }

        function renderWorkbench() {
            const g = openGroupData;
            const wb = document.getElementById('workbenchBody');
            const fns = (g.functions || []).map(f => `<span class="badge bg-primary me-1">${escapeHtml(f)}</span>`).join('');

            const comps = g.compositions.map(c => `
                <div class="wb-row">
                    <input class="form-check-input comp-check" type="checkbox" value="${c.id}" onchange="renderCompActions()">
                    <div class="flex-grow-1">
                        <span class="fw-semibold">${escapeHtml(c.title || 'Untitled')}</span>
                        <span class="text-muted">&mdash; ${c.composer ? escapeHtml(c.composer) : 'Anon'}</span>
                        <div>${compAttr(c)}
                            ${(c.sources || []).map(s => `<span class="src-badge">${escapeHtml(s.code)}${s.position ? ' (' + escapeHtml(s.position) + ')' : ''}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            const editions = g.editions.length ? g.editions.map(e => `
                <div class="wb-row">
                    <div class="flex-grow-1">
                        ${escapeHtml(e.editor_name || 'Unknown editor')}
                        ${e.voicing ? `<span class="chip">${escapeHtml(e.voicing)}</span>` : ''}
                        ${safeUrl(e.file_url) ? `<a href="${safeUrl(e.file_url)}" target="_blank" rel="noopener" class="ms-1">open <i class="bi bi-box-arrow-up-right"></i></a>` : ''}
                    </div>
                    ${confirmBtnHtml('deleteEdition', e.id, 'Remove')}
                </div>
            `).join('') : '<div class="text-muted small py-1">No editions.</div>';

            const recordings = g.recordings.length ? g.recordings.map(r => `
                <div class="wb-row">
                    <div class="flex-grow-1">
                        ${escapeHtml(r.performer_name || 'Unknown performer')}
                        ${safeUrl(r.file_url) ? `<a href="${safeUrl(r.file_url)}" target="_blank" rel="noopener" class="ms-1">open <i class="bi bi-box-arrow-up-right"></i></a>` : ''}
                    </div>
                    ${confirmBtnHtml('deleteRecording', r.id, 'Remove')}
                </div>
            `).join('') : '<div class="text-muted small py-1">No recordings.</div>';

            wb.innerHTML = `
                <div class="d-flex align-items-start gap-2">
                    <div class="flex-grow-1" id="titleArea">
                        <h5 class="mb-1">${escapeHtml(g.display_title)}
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1 ms-1" onclick="editTitle()" title="Rename display title"><i class="bi bi-pencil"></i> Rename</button>
                        </h5>
                        <div>${fns}</div>
                        <div class="text-muted small">group #${g.id}</div>
                    </div>
                </div>

                <div class="wb-section">
                    <div class="d-flex align-items-center justify-content-between">
                        <h6 class="mb-0">Inclusions <span class="text-muted">(${g.compositions.length})</span></h6>
                        <span class="text-muted small">tick to move / split</span>
                    </div>
                    ${comps}
                    <div id="compActions" class="mt-2" style="display:none">
                        <button class="btn btn-sm btn-outline-primary" onclick="showMovePanel('existing')"><i class="bi bi-arrow-right-circle"></i> Move to another group&hellip;</button>
                        <button class="btn btn-sm btn-outline-primary" onclick="showMovePanel('new')"><i class="bi bi-diagram-2"></i> Split into new group</button>
                        <div id="movePanel" class="move-panel mt-2" style="display:none"></div>
                    </div>
                </div>

                <div class="wb-section">
                    <h6 class="mb-1">Editions <span class="text-muted">(${g.editions.length})</span></h6>
                    ${editions}
                    <div class="inline-add mt-2">
                        <div class="row g-2 align-items-center">
                            <div class="col-12 col-xl-5"><input type="url" id="newEditionUrl" class="form-control form-control-sm" placeholder="File URL (PDF)"></div>
                            <div class="col-6 col-xl-3"><select id="newEditionEditor" class="form-select form-select-sm"><option value="">Editor&hellip;</option></select></div>
                            <div class="col-3 col-xl-2"><input type="text" id="newEditionVoicing" class="form-control form-control-sm" placeholder="Voicing"></div>
                            <div class="col-3 col-xl-2"><button class="btn btn-success btn-sm w-100" onclick="addEdition()">Add edition</button></div>
                        </div>
                    </div>
                </div>

                <div class="wb-section">
                    <h6 class="mb-1">Recordings <span class="text-muted">(${g.recordings.length})</span></h6>
                    ${recordings}
                    <div class="inline-add mt-2">
                        <div class="row g-2 align-items-center">
                            <div class="col-12 col-xl-6"><input type="url" id="newRecordingUrl" class="form-control form-control-sm" placeholder="Recording URL (YouTube, Spotify&hellip;)"></div>
                            <div class="col-7 col-xl-4"><select id="newRecordingPerformer" class="form-select form-select-sm"><option value="">Performer&hellip;</option></select></div>
                            <div class="col-5 col-xl-2"><button class="btn btn-success btn-sm w-100" onclick="addRecording()">Add recording</button></div>
                        </div>
                    </div>
                </div>
            `;
            fillEntitySelects();
        }

        // Editor/performer dropdowns for the inline add rows (cached).
        let entityCache = null;
        async function fillEntitySelects() {
            if (!entityCache) {
                try {
                    const [ed, pf] = await Promise.all([api('/api/admin/editors'), api('/api/admin/performers')]);
                    entityCache = { editors: ed.editors || [], performers: pf.performers || [] };
                } catch { entityCache = { editors: [], performers: [] }; }
            }
            const edSel = document.getElementById('newEditionEditor');
            const pfSel = document.getElementById('newRecordingPerformer');
            if (edSel) entityCache.editors.forEach(e => { const o = document.createElement('option'); o.value = e.id; o.textContent = e.name; edSel.appendChild(o); });
            if (pfSel) entityCache.performers.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; pfSel.appendChild(o); });
        }

        // ---- inline title rename ----
        function editTitle() {
            const area = document.getElementById('titleArea');
            const current = openGroupData.display_title;
            area.innerHTML = `
                <div class="input-group input-group-sm" style="max-width:520px">
                    <input type="text" id="titleInput" class="form-control" value="${escapeHtml(current)}">
                    <button class="btn btn-success" onclick="saveTitle()">Save</button>
                    <button class="btn btn-outline-secondary" onclick="renderWorkbench()">Cancel</button>
                </div>`;
            document.getElementById('titleInput').focus();
        }

        async function saveTitle() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) return toast('Title cannot be empty', false);
            try {
                await api('/api/admin/groups/' + openGroupId, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_title: title }),
                });
                openGroupData.display_title = title;
                const row = results.find(r => r.id === openGroupId);
                if (row) { row.display_title = title; renderResults(); }
                renderWorkbench();
                toast('Display title updated');
            } catch (e) { toast(e.message, false); }
        }

        // ---- delete with inline confirm ----
        function confirmBtnHtml(fn, id, label) {
            return `<button class="btn btn-sm btn-outline-danger" onclick="armConfirm(this, '${fn}', ${id})">${label}</button>`;
        }
        function armConfirm(btn, fn, id) {
            if (btn.dataset.armed) { window[fn](id); return; }
            btn.dataset.armed = '1';
            btn.classList.replace('btn-outline-danger', 'btn-danger');
            btn.textContent = 'Confirm?';
            setTimeout(() => {
                if (!btn.isConnected) return;
                delete btn.dataset.armed;
                btn.classList.replace('btn-danger', 'btn-outline-danger');
                btn.textContent = 'Remove';
            }, 3000);
        }

        async function deleteEdition(id) {
            try {
                await api('/api/admin/groups/editions/' + id, { method: 'DELETE' });
                bumpCount('edition_count', -1);
                await openGroup(openGroupId);
                toast('Edition removed');
            } catch (e) { toast(e.message, false); }
        }

        async function deleteRecording(id) {
            try {
                await api('/api/admin/groups/recordings/' + id, { method: 'DELETE' });
                bumpCount('recording_count', -1);
                await openGroup(openGroupId);
                toast('Recording removed');
            } catch (e) { toast(e.message, false); }
        }

        function bumpCount(field, delta) {
            const row = results.find(r => r.id === openGroupId);
            if (row) { row[field] = parseInt(row[field]) + delta; renderResults(); }
        }

        // ---- add edition / recording ----
        async function addEdition() {
            const fileUrl = document.getElementById('newEditionUrl').value.trim();
            if (!fileUrl) return toast('Enter the edition file URL', false);
            try {
                await api('/api/admin/groups/editions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        groupId: openGroupId,
                        editorId: document.getElementById('newEditionEditor').value || null,
                        voicing: document.getElementById('newEditionVoicing').value.trim() || null,
                        fileUrl,
                    }),
                });
                bumpCount('edition_count', 1);
                await openGroup(openGroupId);
                toast('Edition added');
            } catch (e) { toast(e.message, false); }
        }

        async function addRecording() {
            const fileUrl = document.getElementById('newRecordingUrl').value.trim();
            if (!fileUrl) return toast('Enter the recording URL', false);
            try {
                await api('/api/admin/groups/recordings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        groupId: openGroupId,
                        performerId: document.getElementById('newRecordingPerformer').value || null,
                        fileUrl,
                    }),
                });
                bumpCount('recording_count', 1);
                await openGroup(openGroupId);
                toast('Recording added');
            } catch (e) { toast(e.message, false); }
        }

        // ---- move / split compositions ----
        function checkedCompIds() {
            return [...document.querySelectorAll('.comp-check:checked')].map(c => parseInt(c.value));
        }

        function renderCompActions() {
            document.getElementById('compActions').style.display = checkedCompIds().length ? 'block' : 'none';
            if (!checkedCompIds().length) { document.getElementById('movePanel').style.display = 'none'; moveState = null; }
        }

        function showMovePanel(mode) {
            const ids = checkedCompIds();
            if (!ids.length) return;
            moveState = { mode, targetId: null, targetTitle: null };
            const panel = document.getElementById('movePanel');
            panel.style.display = 'block';
            if (mode === 'new') {
                const firstComp = openGroupData.compositions.find(c => c.id === ids[0]);
                panel.innerHTML = `
                    <div class="mb-1 small fw-semibold">Split ${ids.length} inclusion${ids.length === 1 ? '' : 's'} into a new group</div>
                    <div class="input-group input-group-sm" style="max-width:520px">
                        <input type="text" id="newGroupTitle" class="form-control" value="${escapeHtml(firstComp ? (firstComp.title || '') : '')}" placeholder="New group display title">
                        <button class="btn btn-primary" onclick="doMove()">Create &amp; move</button>
                        <button class="btn btn-outline-secondary" onclick="hideMovePanel()">Cancel</button>
                    </div>
                    <div class="text-muted small mt-1">Editions and recordings stay with this group.</div>`;
                document.getElementById('newGroupTitle').focus();
            } else {
                panel.innerHTML = `
                    <div class="mb-1 small fw-semibold">Move ${ids.length} inclusion${ids.length === 1 ? '' : 's'} to&hellip;</div>
                    <input type="text" id="moveSearch" class="form-control form-control-sm mb-1" placeholder="Search groups by title&hellip;">
                    <div id="moveResults" class="small text-muted">Type to search for the target group.</div>
                    <div class="mt-2">
                        <button class="btn btn-primary btn-sm" id="moveConfirmBtn" onclick="doMove()" disabled>Move</button>
                        <button class="btn btn-outline-secondary btn-sm" onclick="hideMovePanel()">Cancel</button>
                    </div>
                    <div class="text-muted small mt-1">The target group must match in voices, type, tone and even/odd. Editions and recordings stay here.</div>`;
                let t = null;
                document.getElementById('moveSearch').addEventListener('input', function () {
                    clearTimeout(t);
                    t = setTimeout(() => moveTargetSearch(this.value.trim()), 300);
                });
                document.getElementById('moveSearch').focus();
            }
        }

        function hideMovePanel() {
            document.getElementById('movePanel').style.display = 'none';
            moveState = null;
        }

        async function moveTargetSearch(term) {
            const out = document.getElementById('moveResults');
            if (!term) { out.innerHTML = 'Type to search for the target group.'; return; }
            try {
                const data = await api('/api/admin/groups?' + new URLSearchParams({ title: term, page: 1, page_size: 8, sort: 'title' }));
                const items = data.groups.filter(g => g.id !== openGroupId);
                out.innerHTML = items.length ? items.map(g => `
                    <div class="move-target" id="mt-${g.id}" onclick="chooseMoveTarget(${g.id}, this)">
                        <strong>${escapeHtml(g.display_title)}</strong>
                        <span class="text-muted">— ${g.composers ? escapeHtml(g.composers) : 'Anon'}</span>
                        ${attrChips(g)}
                    </div>`).join('') : '<span class="text-muted">No other groups match.</span>';
            } catch (e) { out.innerHTML = `<span class="text-danger">${escapeHtml(e.message)}</span>`; }
        }

        function chooseMoveTarget(id, el) {
            document.querySelectorAll('.move-target').forEach(x => x.classList.remove('chosen'));
            el.classList.add('chosen');
            moveState.targetId = id;
            document.getElementById('moveConfirmBtn').disabled = false;
        }

        async function doMove() {
            const ids = checkedCompIds();
            if (!ids.length || !moveState) return;
            const body = { compositionIds: ids };
            if (moveState.mode === 'new') {
                const title = document.getElementById('newGroupTitle').value.trim();
                if (!title) return toast('Enter a title for the new group', false);
                body.newGroupTitle = title;
            } else {
                if (!moveState.targetId) return toast('Choose a target group', false);
                body.targetGroupId = moveState.targetId;
            }
            try {
                const data = await api('/api/admin/groups/move-compositions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                toast(data.message);
                await search(true);
                openGroup(data.targetGroupId);
            } catch (e) { toast(e.message, false); }
        }

        // ================= wiring =================
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => search(true), 300);
        });
        ['voicesFilter', 'composerFilter', 'typeFilter', 'toneFilter', 'evenOddFilter'].forEach(id =>
            document.getElementById(id).addEventListener('change', () => search(true)));
        ['hasEditionsFilter', 'hasRecordingsFilter'].forEach(id =>
            document.getElementById(id).addEventListener('change', () => search(true)));

        loadFilterOptions().then(() => {
            const params = new URLSearchParams(location.search);
            const g = parseInt(params.get('group'), 10);
            if (g) openGroup(g);
        });
    </script>
    <script src="/js/admin-layout.js"></script>
</body>
</html>
